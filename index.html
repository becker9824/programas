// Secretario (o coordinador): resumen del mes por grupo y los informes de cada publicador.
// Tocar una fila abre el informe para capturarlo o corregirlo.
function congregationReports() {
  let month = defaultMonth();
  const box = h('div');
  async function reload() {
    box.replaceChildren(h('div', { class: 'muted' }, 'Cargando…'));
    // Este mes y los 5 anteriores: los "publicadores activos" informaron en los últimos 6 meses
    const months = monthsBefore(month, 6);
    let docs;
    try {
      const q = F.query(F.collection(F.db, 'congregaciones', nube.cong, 'informes'), F.where('mes', 'in', months));
      docs = (await F.getDocs(q)).docs.map(d => d.data());
    } catch (e) { return box.replaceChildren(h('div', { class: 'err' }, errMsg(e))); }
    const cur = docs.filter(d => d.mes === month);
    const byProfile = new Map(cur.map(d => [d.perfil, d]));
    const lastGroup = new Map(docs.filter(d => d.mes === months[1]).map(d => [d.perfil, d.grupo]));
    const people = state.profiles.filter(isPublisher).map(p => ({ id: p.id, nombre: p.name, tipo: p.tipo, r: byProfile.get(p.id) }));
    for (const d of cur) if (!people.some(p => p.r === d)) {
      const pr = profById(d.perfil);
      people.push({ id: d.perfil, nombre: pr ? pr.name : d.nombre + ' (perfil eliminado)', tipo: pr && pr.tipo, r: d });
    }
    people.sort(byNombre);
    const active = new Set(docs.filter(d => d.participo).map(d => d.perfil)).size;
    const groups = GRUPOS.map(([k, , label]) => {
      const rs = cur.filter(d => d.participo && (d.grupo || 'pub') === k);
      return { k, label, n: rs.length, hours: Math.round(rs.reduce((a, d) => a + (d.horas || 0), 0) * 100) / 100,
        studies: rs.reduce((a, d) => a + (d.cursos || 0), 0) };
    });
    const missing = people.filter(p => !p.r);
    const summary = [`Informe de la congregación · ${fmtMonth(month)}`, `Publicadores activos: ${active}`,
      ...groups.map(g => `${g.label}: ${g.n} informaron${g.k !== 'pub' ? `, ${g.hours} horas` : ''}, ${g.studies} cursos bíblicos`),
      missing.length ? `Sin informe (${missing.length}): ${missing.map(p => p.nombre).join(', ')}` : 'Todos informaron.'].join('\n');
    const csv = () => {
      const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const rows = [['Nombre', 'Grupo', 'Participó', 'Horas', 'Cursos', 'Notas'],
        ...people.map(p => p.r ? [p.nombre, grupoLabel(p.r.grupo), p.r.participo ? 'Sí' : 'No', p.r.horas ?? '', p.r.cursos || 0, p.r.notas || '']
          : [p.nombre, '', 'Sin informe', '', '', ''])];
      const a = h('a', { href: URL.createObjectURL(new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\r\n')], { type: 'text/csv' })),
        download: `Informes ${fmtMonth(month)}.csv` });
      a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    const open = p => {
      const dlg = h('dialog', { class: 'dlg' },
        h('div', { class: 'dlg-body' }, h('h3', null, `${p.nombre} · ${fmtMonth(month)}`),
          reportForm(p.id, p.nombre, month, p.r || null, () => { dlg.close(); reload(); }, false,
            p.tipo === 'reg' ? 'reg' : lastGroup.get(p.id))),
        h('div', { class: 'dlg-foot' }, h('button', { class: 'btn', onclick: () => dlg.close() }, 'Cerrar')));
      dlg.addEventListener('close', () => dlg.remove());
      document.body.append(dlg); dlg.showModal();
    };
    box.replaceChildren(
      h('div', { class: 'totals' },
        h('span', null, h('strong', null, `${people.length - missing.length} de ${people.length}`), ' con informe'),
        h('span', null, h('strong', null, active), ' publicadores activos')),
      h('div', { class: 'tablewrap', style: { marginBottom: '12px' } }, h('table', { class: 'stats' },
        h('thead', null, h('tr', null, ['Grupo', 'Informaron', 'Horas', 'Cursos bíblicos'].map(t => h('th', null, t)))),
        h('tbody', null, groups.map(g => h('tr', { style: { cursor: 'default' } },

const stampMs = t => t && t.toMillis ? t.toMillis() : Date.now(); // recién creado: la hora del servidor aún no llega
const seenKey = () => 'anuncios-vistos-' + (nube.user ? nube.user.uid : '');
const seenAt = () => { try { return +localStorage.getItem(seenKey()) || 0; } catch (e) { return 0; } };
// Los vencidos solo los siguen viendo los ancianos (marcados como vencidos)
function visibleAnnouncements() {
  const today = todayISO();
  return nube.anuncios.filter(a => isElder() || !a.vence || a.vence >= today)
    .sort((a, b) => b.fijado - a.fijado || stampMs(b.fecha) - stampMs(a.fecha));
}
const unreadAnnouncements = () => {
  const seen = seenAt(), today = todayISO();
  return nube.anuncios.filter(a => a.autor !== nube.user.uid && stampMs(a.fecha) > seen && (!a.vence || a.vence >= today)).length;
};
// Texto con saltos de línea y enlaces que se pueden tocar
function richText(text) {
  const out = [];
  for (const part of (text || '').split(/(https?:\/\/[^\s<>"]+)/g)) {
    if (/^https?:\/\//.test(part)) out.push(h('a', { href: part, target: '_blank', rel: 'noopener' }, part));
    else part.split('\n').forEach((line, i) => { if (i) out.push(h('br')); if (line) out.push(line); });
  }
  return out;
}

// ---------- cuentas de la congregación (función "Cuentas") ----------
// Movimientos en cuentas/{id}: entrada o salida de un fondo (efectivo o banco), o transferencia
// entre los dos. El saldo inicial (cuentasConfig/inicial) cuenta desde su fecha.
const FONDOS = { caja: 'Efectivo', banco: 'Banco' };
const CATS = {
  entrada: [['donacion_cong', 'Donaciones para la congregación'], ['donacion_mundial', 'Donaciones para la obra mundial'], ['otra_entrada', 'Otra entrada']],
  salida: [['gasto', 'Gastos de la congregación'], ['envio_mundial', 'Envío a la sucursal (obra mundial)'], ['resolucion', 'Resolución'], ['otra_salida', 'Otra salida']],
  transferencia: [['deposito', 'Depósito de efectivo al banco'], ['retiro', 'Retiro del banco a efectivo']],
};
const catLabel = (tipo, k) => ((CATS[tipo] || []).find(([x]) => x === k) || [k, k])[1];
const round2 = n => Math.round(n * 100) / 100;
const money = n => (n < 0 ? '-$' : '$') + Math.abs(round2(n)).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
// Cuánto cambia cada fondo con un movimiento
function effect(m) {
  const d = { caja: 0, banco: 0 };
  if (m.tipo === 'entrada') d[m.fondo] += m.monto;
  else if (m.tipo === 'salida') d[m.fondo] -= m.monto;
  else { d[m.fondo] -= m.monto; d[m.fondo === 'caja' ? 'banco' : 'caja'] += m.monto; }
  return d;
}
const byDate = (a, b) => a.fecha.localeCompare(b.fecha) || stampMs(a.creado) - stampMs(b.creado);

  const monto = h('input', { type: 'number', min: 0.01, step: 0.01, value: m ? m.monto : '', placeholder: '0.00', style: { width: '160px' } });
  const desc = h('input', { type: 'text', maxlength: 300, value: m ? m.descripcion : '', placeholder: tipo === 'salida' ? 'Ej.: Recibo de luz de octubre' : 'Ej.: Cajas de contribuciones' });
  const err = h('div', { class: 'err' });
  const close = () => { dlg.close(); dlg.remove(); };
  const title = { entrada: 'Entrada', salida: 'Salida', transferencia: 'Transferencia' }[tipo];
  const dlg = h('dialog', { class: 'dlg' },
    h('div', { class: 'dlg-body' }, h('h3', null, (m ? 'Editar ' : 'Nueva ') + title.toLowerCase()),

        h('label', { class: 'field' }, 'Fecha', fecha),
        h('label', { class: 'field' }, 'Monto', monto),
        tipo === 'transferencia' ? null : h('label', { class: 'field' }, tipo === 'entrada' ? 'Entra a' : 'Sale de', fondo)),

      h('label', { class: 'field' }, 'Descripción', desc),
      err),
    h('div', { class: 'dlg-foot' },
      m ? h('button', { class: 'btn danger', style: { marginRight: 'auto' }, onclick: async () => {
        if (!confirm(`¿Borrar “${m.descripcion || catLabel(m.tipo, m.categoria)}” por ${money(m.monto)}?`)) return;
        try { await F.deleteDoc(congRef('cuentas', m.id)); toast('Movimiento borrado'); close(); } catch (e) { err.textContent = errMsg(e); }
      } }, 'Borrar') : null,
      h('button', { class: 'btn', onclick: close }, 'Cancelar'),

        const data = { fecha: fecha.value, tipo, categoria: cat.value, descripcion: squash(desc.value), monto: amount,

        e.target.disabled = true;
        try {
          if (m) await F.setDoc(congRef('cuentas', m.id), { ...data, creado: m.creado || F.serverTimestamp() });

          toast('Guardado'); close();
        } catch (ex) { err.textContent = errMsg(ex); e.target.disabled = false; }
      } }, 'Guardar')));

function renderAccounts() {
  const ini = nube.cuentasIni;
  if (!ini) return h('div', null, h('h1', null, 'Cuentas'),
    h('div', { class: 'card settings' },
      h('p', null, 'Para empezar, anota cuánto hay hoy en efectivo y en el banco.'),
      h('div', { class: 'row' }, h('button', { class: 'btn primary', onclick: openInitialDialog }, 'Poner saldo inicial'))));
  let month = renderAccounts.month || todayISO().slice(0, 7);
  const months = [...new Set([...recentMonths(12), month])].sort().reverse();
  const counted = nube.cuentas.filter(m => m.fecha >= ini.fecha).sort(byDate);
  const add = (a, b) => ({ caja: a.caja + b.caja, banco: a.banco + b.banco });
  const sum = list => list.reduce((acc, m) => add(acc, effect(m)), { caja: 0, banco: 0 });
  const start = add({ caja: ini.caja, banco: ini.banco }, sum(counted.filter(m => m.fecha < month + '-01')));
  const inMonth = counted.filter(m => m.fecha.startsWith(month));
  const end = add(start, sum(inMonth));
  const total = (tipo, fondo) => round2(inMonth.filter(m => m.tipo === tipo && (!fondo || m.fondo === fondo)).reduce((a, m) => a + m.monto, 0));
  const byCat = tipo => CATS[tipo].map(([k, label]) => [label, round2(inMonth.filter(m => m.tipo === tipo && m.categoria === k).reduce((a, m) => a + m.monto, 0))]).filter(([, v]) => v);
  // Donaciones para la obra mundial recibidas y aún no enviadas a la sucursal (hasta el fin del mes)
  const upTo = counted.filter(m => m.fecha.slice(0, 7) <= month);
  const pendingWorld = round2(upTo.filter(m => m.categoria === 'donacion_mundial').reduce((a, m) => a + m.monto, 0)
    - upTo.filter(m => m.categoria === 'envio_mundial').reduce((a, m) => a + m.monto, 0));
  const before = nube.cuentas.length - counted.length;

  let run = start.caja + start.banco;
  const rows = inMonth.map(m => {
    const d = effect(m); run += d.caja + d.banco;
    const cell = v => h('td', { style: { color: v > 0 ? 'var(--green)' : v < 0 ? 'var(--red)' : 'var(--muted)', whiteSpace: 'nowrap' } }, v ? (v > 0 ? '+' : '') + money(v) : '—');
    return h('tr', { onclick: () => openMovementDialog(m.tipo, m, month), title: 'Tocar para editar o borrar' },
      h('td', { style: { whiteSpace: 'nowrap' } }, fmtShort(m.fecha)),
      h('td', null, h('strong', null, m.descripcion || catLabel(m.tipo, m.categoria)), h('div', { class: 'muted small-text' }, catLabel(m.tipo, m.categoria))),
      cell(d.caja), cell(d.banco), h('td', { style: { whiteSpace: 'nowrap' } }, money(run)));
  });

  const summary = [`Cuentas de la congregación · ${fmtMonth(month)}`,
    `Saldo inicial: efectivo ${money(start.caja)}, banco ${money(start.banco)}, total ${money(start.caja + start.banco)}`,
    `Entradas: ${money(total('entrada'))}`, ...byCat('entrada').map(([l, v]) => `  · ${l}: ${money(v)}`),
    `Salidas: ${money(total('salida'))}`, ...byCat('salida').map(([l, v]) => `  · ${l}: ${money(v)}`),
    `Saldo final: efectivo ${money(end.caja)}, banco ${money(end.banco)}, total ${money(end.caja + end.banco)}`,
    pendingWorld ? `Obra mundial por enviar a la sucursal: ${money(pendingWorld)}` : 'Obra mundial: todo enviado a la sucursal.'].join('\n');
  const csv = () => {
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const lines = [['Fecha', 'Tipo', 'Categoría', 'Descripción', 'Efectivo', 'Banco'],
      ...inMonth.map(m => { const d = effect(m); return [m.fecha, m.tipo, catLabel(m.tipo, m.categoria), m.descripcion, round2(d.caja), round2(d.banco)]; })];

// numero, nombre, notas, coords (JSON de [[lat, lng], …]), estado, asignadoA, desde

const WEB_URL = 'https://becker9824.github.io/programas/';
const TERR = {
  disponible: { label: 'Disponible', color: '#1b9e4b' },
  asignado: { label: 'Asignado', color: '#e08a00' },

};

let terr = null; // mapa abierto: { L, map, group, selected, draw, refresh }

function loadScript(src, css) {
  return (loadScript[src] = loadScript[src] || new Promise((res, rej) => {
    if (css) document.head.append(h('link', { rel: 'stylesheet', href: css }));
    document.head.append(h('script', { src, onload: () => res(), onerror: () => { loadScript[src] = null; rej(new Error('No se pudo cargar ' + src)); } }));
  }));
}
const loadLeaflet = () => loadScript('vendor/leaflet/leaflet.js', 'vendor/leaflet/leaflet.css').then(() => window.L);
const loadQR = () => loadScript('vendor/qrcode.js').then(() => window.qrcode);

// Polilínea codificada (el formato de Google): las coordenadas caben en el enlace del QR
function encodePoly(points) {
  let out = '', pl = 0, pg = 0;
  const enc = v => { v = v < 0 ? ~(v << 1) : v << 1; let s = ''; while (v >= 0x20) { s += String.fromCharCode((0x20 | (v & 0x1f)) + 63); v >>= 5; } return s + String.fromCharCode(v + 63); };
  for (const [lat, lng] of points) { const a = Math.round(lat * 1e5), b = Math.round(lng * 1e5); out += enc(a - pl) + enc(b - pg); pl = a; pg = b; }
  return out;
}
function decodePoly(str) {
  const pts = []; let i = 0, lat = 0, lng = 0;
  const dec = () => { let r = 0, sh = 0, b; do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20); return r & 1 ? ~(r >> 1) : r >> 1; };
  while (i < str.length) { lat += dec(); lng += dec(); pts.push([lat / 1e5, lng / 1e5]); }
  return pts;
}
const coordsOf = t => { try { return JSON.parse(t.coords || '[]'); } catch (e) { return []; } };
const shareUrl = t => `${WEB_URL}#ver&n=${encodeURIComponent(t.numero)}&t=${encodeURIComponent(t.nombre || '')}&p=${encodeURIComponent(encodePoly(coordsOf(t)))}`;

function baseMap(L, el) {
  const map = L.map(el);
  const streets = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imágenes © Esri' });
  L.control.layers({ 'Calles': streets, 'Satélite': sat }).addTo(map);
  return map;
}
// "Dónde estoy": un punto azul en la ubicación del celular
function locateButton(L, map) {
  let dot = null;
  return h('button', { class: 'btn small', onclick: () => {
    if (!navigator.geolocation) return toast('Este equipo no puede dar su ubicación');
    navigator.geolocation.getCurrentPosition(pos => {
      const ll = [pos.coords.latitude, pos.coords.longitude];
      if (dot) dot.remove();
      dot = L.circleMarker(ll, { radius: 8, color: '#fff', weight: 2, fillColor: '#1a73e8', fillOpacity: 1 }).addTo(map);
      map.setView(ll, Math.max(map.getZoom(), 17));
    }, () => toast('No se pudo obtener tu ubicación. Revisa que la app tenga permiso.'), { enableHighAccuracy: true, timeout: 15000 });
  } }, '📍 Dónde estoy');
}

function openQRDialog(t) {
  const url = shareUrl(t), box = h('div', { style: { display: 'grid', placeItems: 'center' } }, 'Cargando…');
  loadQR().then(qrcode => { const q = qrcode(0, 'M'); q.addData(url); q.make(); box.innerHTML = q.createSvgTag({ cellSize: 5, margin: 2, scalable: true }); box.firstChild.style.width = '240px'; box.firstChild.style.background = '#fff'; })
    .catch(() => { box.textContent = 'No se pudo crear el QR.'; });

}

// Tarjetas para imprimir: 6 por hoja, con número, nombre, notas y QR
async function territoryCardsPDF(list) {
  const J = window.jspdf && window.jspdf.jsPDF;
  if (!J) return toast('No se pudo crear el PDF.');
  let qrcode;
  try { qrcode = await loadQR(); } catch (e) { return toast('No se pudo crear el QR.'); }
  const doc = new J({ unit: 'mm', format: state.settings.paper === 'a4' ? 'a4' : 'letter' });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 10;
  const cw = (W - M * 3) / 2, ch = (H - M * 4) / 3;
  list.forEach((t, i) => {
    if (i && i % 6 === 0) doc.addPage();
    const x = M + (i % 2) * (cw + M), y = M + (Math.floor(i / 2) % 3) * (ch + M);
    doc.setDrawColor(150); doc.setLineWidth(0.3); doc.roundedRect(x, y, cw, ch, 3, 3);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(22); doc.setTextColor(0); doc.text(`Territorio ${t.numero}`, x + 6, y + 12);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(12);
    if (t.nombre) doc.text(doc.splitTextToSize(t.nombre, cw - 52), x + 6, y + 20);
    if (t.notas) { doc.setFontSize(9); doc.setTextColor(90); doc.text(doc.splitTextToSize(t.notas, cw - 52).slice(0, 8), x + 6, y + 30); }
    const q = qrcode(0, 'M'); q.addData(shareUrl(t)); q.make();
    const n = q.getModuleCount(), size = 40, cell = size / n, qx = x + cw - size - 5, qy = y + 6;
    doc.setFillColor(0);
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) doc.rect(qx + c * cell, qy + r * cell, cell + 0.02, cell + 0.02, 'F');
    doc.setFontSize(8); doc.setTextColor(90); doc.text('Escanea para ver la zona en el mapa', qx + size / 2, qy + size + 4, { align: 'center' });
  });
  savePDF(doc, list.length === 1 ? `Territorio ${list[0].numero}` : `Tarjetas de territorio`);
}

// Cambia el estado; al dejar de estar asignado, queda en el historial quién lo tuvo
async function setTerritoryState(t, estado, asignadoA = '', desde = todayISO()) {
  const historial = [...(t.historial || [])];
  if (t.estado === 'asignado' && estado !== 'asignado') historial.push({ quien: t.asignadoA, desde: t.desde || '', hasta: desde });
  try {
    await F.updateDoc(congRef('territorios', t.id), { estado, asignadoA, desde, historial: historial.slice(-50) });
    toast(`Territorio ${t.numero}: ${TERR[estado].label.toLowerCase()}`);
  } catch (e) { toast(errMsg(e)); }
}

function renderTerritories() {
  const editor = can('territorios');
  if (terr && terr.map) terr.map.remove();
  terr = { selected: terr && terr.selected, filter: (terr && terr.filter) || 'todos' };
  const mapEl = h('div', { style: { height: '58vh', minHeight: '320px', borderRadius: '12px', zIndex: 0 } });
  const drawBar = h('div');
  const panel = h('div');
  const list = h('div');
  const counts = h('div', { class: 'totals' });
  const tools = h('div', { class: 'row' });

  loadLeaflet().then(L => {
    const map = baseMap(L, mapEl);
    Object.assign(terr, { L, map, group: L.featureGroup().addTo(map) });
    map.on('click', e => { if (terr.draw) addPoint(e.latlng); });
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('terr-vista-' + nube.cong)); } catch (e) {}
    map.on('moveend', () => { try { localStorage.setItem('terr-vista-' + nube.cong, JSON.stringify([map.getCenter(), map.getZoom()])); } catch (e) {} });
    drawLayers();
    if (saved) map.setView(saved[0], saved[1]);
    else if (terr.group.getLayers().length) map.fitBounds(terr.group.getBounds(), { padding: [20, 20] });
    else { map.setView([23.6, -102.5], 5); map.locate({ setView: true, maxZoom: 16 }); }
    tools.prepend(locateButton(L, map));
    setTimeout(() => map.invalidateSize(), 50); // por si la página aún acomodaba su tamaño
  }).catch(() => { mapEl.textContent = 'No se pudo cargar el mapa. Revisa tu conexión a internet.'; });

  function drawLayers() {
    const L = terr.L;
    terr.group.clearLayers();
    for (const t of nube.territorios) {
      const c = coordsOf(t);
      if (c.length < 3) continue;
      const sel = t.id === terr.selected, color = (TERR[t.estado] || TERR.disponible).color;
      L.polygon(c, { color: sel ? '#000' : color, weight: sel ? 4 : 2, fillColor: color, fillOpacity: sel ? 0.5 : 0.35 })
        .bindTooltip(String(t.numero), { permanent: true, direction: 'center', className: 'terr-label' })
        .on('click', ev => { if (terr.draw) return addPoint(ev.latlng); select(t.id, false); })
        .addTo(terr.group);
    }
  }

  function select(id, zoom = true) {
    terr.selected = id;
    const t = nube.territorios.find(x => x.id === id);
    if (zoom && t && terr.map && coordsOf(t).length >= 3) terr.map.fitBounds(terr.L.polygon(coordsOf(t)).getBounds(), { padding: [40, 40], maxZoom: 18 });
    refresh();
    if (window.innerWidth < 1000) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ----- dibujar una zona tocando sus esquinas -----
  function startDraw(t) {
    if (!terr.map) return;
    terr.draw = { t, points: [], shape: null, dots: [] };
    terr.map.getContainer().style.cursor = 'crosshair';
    drawBarUpdate();
  }
  function addPoint(ll) {
    const d = terr.draw;
    d.points.push([ll.lat, ll.lng]);
    d.dots.push(terr.L.circleMarker(ll, { radius: 5, color: '#000', fillColor: '#fff', fillOpacity: 1, weight: 2 }).addTo(terr.map));
    redrawShape(); drawBarUpdate();
  }
  function redrawShape() {
    const d = terr.draw;
    if (d.shape) d.shape.remove();
    d.shape = d.points.length > 1 ? terr.L.polygon(d.points, { color: '#000', dashArray: '6 4', weight: 2, fillOpacity: 0.15 }).addTo(terr.map) : null;
  }
  function endDraw() {
    const d = terr.draw;
    if (!d) return;
    if (d.shape) d.shape.remove();
    d.dots.forEach(x => x.remove());
    terr.draw = null;
    terr.map.getContainer().style.cursor = '';
    drawBarUpdate();
  }
  function drawBarUpdate() {
    const d = terr.draw;
    drawBar.replaceChildren(d ? h('div', { class: 'notice warn row spread', style: { margin: '0 0 8px' } },
      h('span', null, d.t ? `Redibujando el territorio ${d.t.numero}: ` : '', `Toca las esquinas de la zona en orden (${d.points.length} puesta${d.points.length === 1 ? '' : 's'}).`),
      h('span', { class: 'row' },
        h('button', { class: 'btn small', disabled: !d.points.length, onclick: () => { d.points.pop(); d.dots.pop().remove(); redrawShape(); drawBarUpdate(); } }, '↶ Deshacer'),
        h('button', { class: 'btn small', onclick: endDraw }, 'Cancelar'),
        h('button', { class: 'btn small primary', disabled: d.points.length < 3, onclick: () => {
          const pts = d.points.map(([a, b]) => [+a.toFixed(6), +b.toFixed(6)]), t = d.t;
          endDraw();
          if (t) F.updateDoc(congRef('territorios', t.id), { coords: JSON.stringify(pts) }).then(() => toast('Zona actualizada')).catch(e => toast(errMsg(e)));
          else openTerritoryDataDialog(null, pts);
        } }, 'Listo'))) : '');
  }

  // ----- panel del territorio elegido y lista -----
  function refresh() {
    if (terr.map) drawLayers();
    const all = [...nube.territorios].sort(byNumero), today = todayISO();
    const n = k => all.filter(t => t.estado === k).length;
    counts.replaceChildren(...Object.entries(TERR).map(([k, v]) => h('span', null,
      h('span', { style: { display: 'inline-block', width: '10px', height: '10px', borderRadius: '50%', background: v.color, marginRight: '5px' } }),
      h('strong', null, n(k)), ' ', v.label.toLowerCase() + (n(k) === 1 ? '' : 's'))));
    const t = all.find(x => x.id === terr.selected);
    const since = t && t.desde ? daysBetween(t.desde, today) : null;
    panel.replaceChildren(t ? h('div', { class: 'card', style: { padding: '14px', marginTop: '12px' } },
      h('div', { class: 'row spread', style: { alignItems: 'flex-start' } },
        h('div', null,
          h('strong', { style: { fontSize: '18px' } }, `Territorio ${t.numero}`, t.nombre ? ` · ${t.nombre}` : ''),
          h('div', { style: { marginTop: '4px' } },
            h('span', { class: 'badge', style: { background: TERR[t.estado].color, color: '#fff' } }, TERR[t.estado].label),
            ' ', t.estado === 'asignado' ? `a ${t.asignadoA}` : '',
            since != null ? h('span', { class: 'muted small-text' }, ` · desde el ${fmtShort(t.desde)} (${since} días)`) : null),
          t.notas ? h('div', { class: 'small-text', style: { marginTop: '6px' } }, richText(t.notas)) : null),
        h('button', { class: 'btn small', onclick: () => { terr.selected = null; refresh(); } }, '✕')),
      h('div', { class: 'row', style: { marginTop: '10px' } },
        editor && t.estado !== 'asignado' ? h('button', { class: 'btn small primary', onclick: () => openAssignDialog(t) }, 'Asignar') : null,
        editor && t.estado === 'asignado' ? h('button', { class: 'btn small primary', onclick: () => setTerritoryState(t, 'terminado') }, '✓ Terminado') : null,
        editor && t.estado !== 'disponible' ? h('button', { class: 'btn small', onclick: () => setTerritoryState(t, 'disponible') }, 'Dejar disponible') : null,
        h('button', { class: 'btn small', onclick: () => openQRDialog(t) }, '▦ QR'),
        h('button', { class: 'btn small', onclick: () => territoryCardsPDF([t]) }, '🖨 Tarjeta'),
        editor ? h('button', { class: 'btn small', onclick: () => openTerritoryDataDialog(t) }, 'Editar datos') : null,
        editor ? h('button', { class: 'btn small', onclick: () => startDraw(t) }, 'Redibujar zona') : null,
        editor ? h('button', { class: 'btn small danger', onclick: async () => {
          if (!confirm(`¿Borrar el territorio ${t.numero}? Se pierde también su historial.`)) return;
          try { await F.deleteDoc(congRef('territorios', t.id)); terr.selected = null; toast('Territorio borrado'); } catch (e) { toast(errMsg(e)); }
        } }, 'Borrar') : null),
      (t.historial || []).length ? h('div', { class: 'hist', style: { marginTop: '10px' } },

// Lo que abre el QR de una tarjeta: solo esa zona en el mapa, sin iniciar sesión
function renderSharedTerritory() {
  const q = new URLSearchParams(location.hash.slice(1));
  const pts = decodePoly(q.get('p') || ''), numero = q.get('n') || '', nombre = q.get('t') || '';
  document.title = `Territorio ${numero}`;
  setBrand(`Territorio ${numero}${nombre ? ' · ' + nombre : ''}`);
  const mapEl = h('div', { style: { height: 'calc(100vh - 170px)', minHeight: '320px', borderRadius: '12px' } });
  const tools = h('div', { class: 'row', style: { marginBottom: '10px' } });
  document.getElementById('app').replaceChildren(tools, mapEl);
  loadLeaflet().then(L => {
    const map = baseMap(L, mapEl);
    if (pts.length >= 3) {
      const poly = L.polygon(pts, { color: '#e08a00', weight: 3, fillOpacity: 0.25 }).addTo(map);
      map.fitBounds(poly.getBounds(), { padding: [30, 30], maxZoom: 18 });
      const c = poly.getBounds().getCenter();
      tools.append(locateButton(L, map),
        h('a', { class: 'btn small', href: `https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lng}`, target: '_blank', rel: 'noopener', style: { textDecoration: 'none' } }, '🧭 Cómo llegar'));
    } else mapEl.textContent = 'Este enlace no tiene una zona válida.';
  }).catch(() => { mapEl.textContent = 'No se pudo cargar el mapa. Revisa tu conexión a internet.'; });
}

// ---------- inicio: lo importante de un vistazo, según las funciones de cada quien ----------
function renderHome() {
  const today = todayISO(), hour = new Date().getHours();
  const hello = hour < 12 ? 'Buenos días' : hour < 19 ? 'Buenas tardes' : 'Buenas noches';
  const firstName = (nube.me.nombre || '').split(' ')[0];
  const weeks = can('programa') ? publicWeeks() : nube.publico ? JSON.parse(nube.publico.semanas || '[]') : [];
  const tile = (ic, title, value, sub, onclick, tone) => h('button', { class: 'tile' + (tone ? ' ' + tone : ''), onclick },
    h('span', { class: 'tile-ic' }, icon(ic, 22)),
    h('span', { class: 'tile-body' }, h('span', { class: 'tile-t' }, title), h('strong', { class: 'tile-v' }, value), sub ? h('span', { class: 'tile-s' }, sub) : null),
    icon('chev', 18));
  const tiles = [];

  const next = weeks.find(w => (w.day || addDays(w.date, 6)) >= today);
  tiles.push(next ? tile('list', 'Próxima reunión', next.meeting.replace(/ de \d{4}$/, ''), next.title, () => go({ name: 'list' }))
    : tile('list', 'Reuniones', 'Sin programa publicado', null, () => go({ name: 'list' })));

  // Informe del mes: se revisa si ya lo envió
  if (reportsByMembers() && nube.me.perfil) {
    const month = defaultMonth();
    const t = tile('report', `Tu informe de ${fmtMonth(month).toLowerCase()}`, 'Revisando…', null, () => go({ name: 'report' }));
    F.getDoc(congRef('informes', `${nube.me.perfil}_${month}`)).then(s => {
      t.replaceWith(s.exists() ? tile('report', `Tu informe de ${fmtMonth(month).toLowerCase()}`, '✓ Enviado', 'Puedes corregirlo si hace falta', () => go({ name: 'report' }), 'ok')
        : tile('report', `Tu informe de ${fmtMonth(month).toLowerCase()}`, 'Pendiente', 'Toca para enviarlo', () => go({ name: 'report' }), 'warn'));
    }).catch(() => {});
    tiles.push(t);
  }

  const unread = unreadAnnouncements(), ann = visibleAnnouncements();
  tiles.push(tile('anuncios', 'Anuncios', unread ? `${unread} nuevo${unread > 1 ? 's' : ''}` : ann.length ? 'Al día' : 'Sin anuncios',
    ann[0] ? ann[0].titulo : null, () => go({ name: 'anuncios' }), unread ? 'warn' : null));

  // Según la función
  if (can('programa')) {
    const thisMonday = mondayOf(today);
    const open = state.programs.filter(p => p.date >= thisMonday && slotsOf(p).some(x => !x.pid)).length;
    tiles.push(tile('people', 'Asignaciones', open ? `${open} semana${open > 1 ? 's' : ''} por completar` : 'Todo asignado',
      'Próximas semanas', () => go({ name: 'list' }), open ? 'warn' : 'ok'));
  }
  if (isAdmin()) {
    const waiting = nube.miembros.filter(m => m.estado !== 'activo').length;
    if (waiting) tiles.push(tile('users', 'Usuarios', `${waiting} esperando aprobación`, 'Toca para revisarlas', () => go({ name: 'users' }), 'warn'));
  }
  if (can('secretario')) tiles.push(tile('report', 'Informes de la congregación', fmtMonth(defaultMonth()), 'Ver quién falta y capturar', () => go({ name: 'report' })));
  if (can('cuentas') && nube.cuentasIni) {
    const ini = nube.cuentasIni;
    const bal = nube.cuentas.filter(m => m.fecha >= ini.fecha).reduce((a, m) => { const d = effect(m); return a + d.caja + d.banco; }, ini.caja + ini.banco);
    tiles.push(tile('cuentas', 'Cuentas', money(bal), 'Saldo total (efectivo y banco)', () => go({ name: 'cuentas' })));
  }
  if (nube.territorios.length) {
    const n = k => nube.territorios.filter(x => x.estado === k).length;
    const count = (k, word) => `${n(k)} ${word}${n(k) === 1 ? '' : 's'}`;

      `${count('asignado', 'asignado')} · ${count('terminado', 'terminado')}`, () => go({ name: 'territorios' })));
  }

  return h('div', null,
    h('div', { class: 'card hello' },
      h('h1', null, `${hello}${firstName ? ', ' + firstName : ''}`),
      h('p', null, congName() || 'Programas y asignaciones')),
    nextAssignmentCard(weeks),
    h('div', { class: 'tiles' }, tiles));
}

function go(v) { view = v; render(); window.scrollTo(0, 0); }

// Cada quien ve solo las secciones de sus funciones
// Secciones del menú: [vista, nombre, aviso con número]. Cada quien ve solo las de sus funciones.
function navItems() {
  if (!FB_CONFIG) return [['list', 'Semanas'], ['people', 'Perfiles'], ['families', 'Familias'], ['settings', 'Ajustes']];
  if (!nube.acceso) return [];
  const items = [['inicio', 'Inicio'], ['list', 'Semanas']];
  if (can('programa')) items.push(['people', 'Perfiles'], ['families', 'Familias']);
  if (isAdmin()) items.push(['users', 'Usuarios', nube.miembros.filter(m => m.estado !== 'activo').length]);
  if (can('secretario')) items.push(['report', 'Informes']);
  else if (reportsByMembers()) items.push(['report', 'Informe']);
  items.push(['anuncios', 'Anuncios', unreadAnnouncements()]);
  if (isElder()) items.push(['directorio', 'Directorio']);
  if (can('cuentas')) items.push(['cuentas', 'Cuentas']);
  items.push(['territorios', 'Territorios']);
  items.push(['settings', 'Ajustes']);
  return items;
}
const isActiveView = v => view.name === v || (view.name === 'edit' && v === 'list');
const badge = n => n ? h('span', { class: 'nbadge' }, n) : null;
// Arriba en la PC; en el celular, barra de abajo con las principales y "Más" para el resto
function buildNav(items = navItems()) {
  document.querySelector('header nav').replaceChildren(...items.map(([v, t, n]) =>
    h('button', { class: isActiveView(v) ? 'active' : null, onclick: () => go({ name: v }) }, icon(v, 18), t, badge(n))));
  const order = ['inicio', 'list', 'report', 'anuncios', 'territorios'];
  const main = items.length <= 5 ? items : order.map(v => items.find(i => i[0] === v)).filter(Boolean).slice(0, 4);
  const rest = items.filter(i => !main.includes(i));
  const tab = ([v, t, n], onclick, active) => h('button', { class: active ? 'active' : null, onclick }, icon(v, 22), t, badge(n));
  document.querySelector('.tabbar').replaceChildren(...[
    ...main.map(i => tab(i, () => go({ name: i[0] }), isActiveView(i[0]))),
    rest.length ? tab(['mas', 'Más', rest.reduce((a, i) => a + (i[2] || 0), 0)], () => openMoreSheet(rest), rest.some(i => isActiveView(i[0]))) : null,
  ].filter(Boolean));
  const name = FB_CONFIG && nube.listo ? congName() : '';
  setBrand(name || 'Programas');
}
function openMoreSheet(items) {
  const close = () => { dlg.close(); dlg.remove(); };
  const dlg = h('dialog', { class: 'sheet', onclick: e => { if (e.target === dlg) close(); } },
    h('div', { class: 'grab' }),
    items.map(([v, t, n]) => h('button', { class: 'item' + (isActiveView(v) ? ' active' : ''), onclick: () => { close(); go({ name: v }); } },
      icon(v, 22), t, badge(n))));
  document.body.append(dlg); dlg.showModal();
}

function render() {
  if (FB_CONFIG && !(nube.acceso && nube.listo)) return; // las pantallas de acceso se dibujan aparte
  const items = navItems();
  if (!items.some(([v]) => isActiveView(v))) view = { name: items[0][0] };
  buildNav(items);
  const app = document.getElementById('app');
  const program = !FB_CONFIG || can('programa');
  if (view.name === 'inicio') return app.replaceChildren(renderHome());
  if (view.name === 'report') return app.replaceChildren(renderReport());
  if (view.name === 'users') return app.replaceChildren(renderUsers());
  if (view.name === 'anuncios') { app.replaceChildren(renderAnnouncements()); return buildNav(); }
  if (view.name === 'directorio') return app.replaceChildren(renderDirectory());
  if (view.name === 'cuentas') return app.replaceChildren(renderAccounts());
  if (view.name === 'territorios') return app.replaceChildren(renderTerritories());
  if (view.name === 'settings') return app.replaceChildren(program ? renderSettings() : renderPubSettings());
  if (!program) return app.replaceChildren(renderPubList());
  refreshDatalist();
  const p = view.name === 'edit' && state.programs.find(x => x.id === view.id);
  app.replaceChildren(
    p ? renderEditor(p) : view.name === 'people' ? renderPeople() : view.name === 'families' ? renderFamilies() : renderList());
}

  const chips = h('div', { class: 'chips' });
  const totalEl = h('span', { class: 'total' });
  const heading = h('div', { class: 'ph2' });
  const rebuild = () => { save(); build(); };
  let suggesting = false, proposals = new Map();
  const skips = new Map();
  const suggestBar = h('div');

  // Botón "Sugerencias": propone a alguien para cada asignación vacía (sin asignarlo).
  // "Otra" pasa a la siguiente opción de esa asignación.
  function computeProposals(ctx) {
    proposals = new Map();
    const reserved = new Set(slotsOf(p).map(x => x.pid).filter(Boolean));
    for (const x of slotsOf(p)) {
      if (x.pid) continue;
      const key = x.row.id + '|' + x.slot;
      const other = x.slot === 'b' ? x.row.a || (proposals.get(x.row.id + '|a') || {}).pr?.id : x.row.b;
      const list = candidatesFor(p, x.row, x.slot, ctx, reserved, other);
      const c = list.length ? list[(skips.get(key) || 0) % list.length] : null;
      proposals.set(key, c);
      if (c) reserved.add(c.pr.id);
    }
  }
  function applyProposal(row, slot) {
    const c = proposals.get(row.id + '|' + slot);
    if (c) assign(row, slot, c.pr.id);
  }

  function updateHints() {
    const ctx = contextFor(p);
    const counts = countsFor(p);
    if (suggesting) computeProposals(ctx);
    body.querySelectorAll('input[data-slot]').forEach(inp => {
      const row = p.rows.find(r => r.id === inp.dataset.row), slot = inp.dataset.slot;
      const hint = inp.nextElementSibling, line = hint.nextElementSibling;
      inp.classList.remove('s-dup', 's-recent', 's-warn');
      const pid = row[slot];
      const c = suggesting && !pid ? proposals.get(row.id + '|' + slot) : undefined;
      line.replaceChildren(c === undefined ? '' : c ? h('div', { class: 'propose' },
        h('span', null, '✨ ', h('strong', null, c.pr.name),
          h('span', { class: 'muted' }, [c.pr.age != null ? ` · ${c.pr.age} años` : '', c.days === Infinity ? ' · nunca' : ` · hace ${c.days} d`].join('')),
          c.rule ? h('span', { class: 'tag-fam', style: c.fits ? null : { color: 'var(--orange)' }, title: c.fits ? 'Cumple el filtro' : 'Nadie disponible cumple el filtro' },
            (c.fits ? '✓ ' : '≈ ') + c.rule.nombre) : null),
        h('span', { class: 'row', style: { gap: '4px' } },
          h('button', { class: 'btn small primary', onclick: () => applyProposal(row, slot) }, 'Aplicar'),
          h('button', { class: 'btn small', onclick: () => { const k = row.id + '|' + slot; skips.set(k, (skips.get(k) || 0) + 1); updateHints(); } }, 'Otra')))
        : h('div', { class: 'propose muted' }, '✨ Nadie disponible para sugerir'));
      if (!pid) { hint.textContent = ''; hint.className = 'hint'; return; }
      const st = statusFor(pid, p, ctx, counts, row, slot);
      hint.textContent = st.text; hint.className = 'hint ' + st.cls;
      if (['s-dup', 's-recent', 's-warn'].includes(st.cls)) inp.classList.add(st.cls);
    });
    const slots = slotsOf(p);
    totalEl.textContent = `${slots.filter(x => x.pid).length} de ${slots.length} asignaciones · termina aprox. a las ${fmtTime(timesFor(p).end)}`;
    const n = [...proposals.values()].filter(Boolean).length, none = proposals.size - n;
    suggestBar.replaceChildren(suggesting ? h('div', { class: 'notice row spread', style: { background: 'var(--accent-2)', color: 'var(--text)', margin: '10px 0 0' } },
      h('span', null, n ? `✨ ${n} sugerencia${n > 1 ? 's' : ''}: según privilegios, filtros de edad, descanso de ${s.restDays} días y quien lleva más tiempo sin participar.`
        + (none ? ` Para ${none} no hay nadie disponible.` : '')
        : none ? `✨ Quedan ${none} vacía${none > 1 ? 's' : ''}, pero no hay nadie disponible que no esté asignado esta semana o descansando.`
          : '✨ Ya no hay asignaciones vacías.'),
      h('span', { class: 'row' },
        n ? h('button', { class: 'btn small primary', onclick: () => {
          for (const [key, c] of proposals) if (c) { const [rid, slot] = key.split('|'); p.rows.find(r => r.id === rid)[slot] = c.pr.id; }
          save(); build(); toast(`Se aplicaron ${n} sugerencias`);
        } }, `Aplicar todas (${n})`) : null,
        h('button', { class: 'btn small', onclick: () => { suggesting = false; proposals = new Map(); build(); } }, 'Ocultar'))) : '');
    updateSide(ctx);
  }

  // Sugerencias para la asignación seleccionada: primero quien puede hacerla y lleva más
  // tiempo sin participar; abajo, aparte, quien está "descansando" (regla de los 28 días).
  function updateSide(ctx = contextFor(p)) {
    const used = new Set(slotsOf(p).map(x => x.pid).filter(Boolean));
    const f = norm(suggFilter.value);
    chips.replaceChildren(...[['all', 'Todos'], ['M', 'Hombres'], ['F', 'Mujeres']].map(([v, t]) =>
      h('button', { class: sexFilter === v ? 'on' : '', onclick: () => { sexFilter = v; updateSide(); } }, t)));
    const fr = focus && p.rows.find(r => r.id === focus.rowId);
    const priv = fr ? privFor(fr, focus.slot) : null;
    privToggle.replaceChildren(priv ? h('label', { class: 'row small-text muted', style: { gap: '6px', margin: '0 0 8px' } },
      h('input', { type: 'checkbox', checked: privOnly, onchange: e => { privOnly = e.target.checked; updateSide(); } }),
      `Solo quien tiene “${privLabel(priv)}”`) : '');
    // En una pareja de estudiantes, los familiares de la otra persona salen primero;
    // luego quien cumple el filtro de la parte (por ejemplo, edad escolar si habla de la escuela)
    const partner = fr && fr.helper === 'Ayudante' ? fr[focus.slot === 'a' ? 'b' : 'a'] : null;
    const rule = fr ? ruleFor(fr) : null;
    const items = state.profiles
      .filter(pr => !used.has(pr.id) && (!f || norm(pr.name).includes(f)))
      .map(pr => {
        const l = ctx.last.get(pr.id);
        return { pr, fam: !!partner && sameFamily(partner, pr.id), days: l ? daysBetween(l.q.date, p.date) : Infinity,
          rest: ctx.recent.get(pr.id), able: !priv || canDo(pr, priv), fits: !!rule && fitsRule(pr, rule) };
      })
      .filter(it => (it.fam || sexFilter === 'all' || it.pr.sex === sexFilter) && (!privOnly || it.able))
      .sort((a, b) => b.fam - a.fam || b.able - a.able || b.fits - a.fits || b.days - a.days || a.pr.name.localeCompare(b.pr.name, 'es'));
    const item = it => h('button', { onclick: () => insertProfile(it.pr), title: it.rest ? restText(it.rest, p).slice(2) : null },
      h('span', { class: 'nm' }, it.pr.name, ' ', h('small', null, `${it.pr.sex === 'M' ? '♂' : '♀'}${it.pr.age != null ? ' ' + it.pr.age : ''}`),
        it.fam ? h('span', { class: 'tag-fam' }, 'Familia') : null,
        it.fits ? h('span', { class: 'tag-fam', title: 'Cumple el filtro de esta parte' }, '✓ ' + rule.nombre) : null,
        it.able ? null : h('span', { class: 'tag-fam', style: { color: 'var(--orange)' } }, 'Sin privilegio')),
      h('span', { class: 'hint ' + (it.rest ? 's-recent' : it.days === Infinity || it.days >= s.staleDays ? 's-stale' : 's-ok') },
        it.days === Infinity ? 'nunca' : `hace ${it.days} d`));
    let ready = items.filter(it => !it.rest), resting = items.filter(it => it.rest);
    // Seamos mejores maestros: 2 hermanas por cada hermano (familiares, con privilegio y filtro siguen primero)
    if (fr && womenFirst(fr, focus.slot, partner) && sexFilter === 'all') {
      const key = it => `${+it.fam}${+it.able}${+it.fits}`;
      const groups = [...new Set(ready.map(key))];
      ready = groups.flatMap(g => preferWomen(ready.filter(it => key(it) === g)));
    }
    const unset = state.profiles.filter(pr => !Array.isArray(pr.puede)).length;
    suggList.replaceChildren(...(items.length ? [
      ...ready.map(item),
      resting.length ? h('div', { class: 'small-text muted', style: { padding: '8px 8px 2px', borderTop: ready.length ? '1px solid var(--border)' : null } },
        `Descansando (menos de ${s.restDays} días)`) : null,
      ...resting.map(it => { const b = item(it); b.style.opacity = '.6'; return b; }),
      priv && unset ? h('div', { class: 'small-text muted', style: { padding: '8px' } },
        `${unset} perfil${unset > 1 ? 'es' : ''} sin privilegios marcados sale${unset > 1 ? 'n' : ''} para todo. Márcalos en Perfiles.`) : null,
    ].filter(Boolean)
      : [h('p', null, state.profiles.length ? 'Nadie disponible con estos filtros.' : 'Aún no hay perfiles. Créalos en la pestaña “Perfiles” o escribiendo un nombre nuevo en el programa.')]));
  }

  function setFocus(row, slot) {
    focus = { rowId: row.id, slot };
    const partner = row.helper === 'Ayudante' && profById(row[slot === 'a' ? 'b' : 'a']);
    sexFilter = slotNeedsMen(row, slot) ? 'M' : partner ? partner.sex : 'all';
    const lb = slotLabels(row);
    const rule = ruleFor(row);
    suggFor.textContent = `Para: ${slot === 'b' ? lb.b : lb.a && !lb.soft ? lb.a : displayTitle(row)}`
      + (rule ? ` · filtro “${rule.nombre}”${ruleText(rule) ? ` (${ruleText(rule)})` : ''}` : '');
    privOnly = true;
    body.querySelectorAll('input.focused').forEach(i => i.classList.remove('focused'));
    const inp = body.querySelector(`input[data-row="${row.id}"][data-slot="${slot}"]`);
    if (inp) inp.classList.add('focused');
    updateSide();
  }

  function assign(row, slot, pid) {
    row[slot] = pid; save();
    const inp = body.querySelector(`input[data-row="${row.id}"][data-slot="${slot}"]`);
    if (inp) inp.value = pid ? profById(pid).name : '';
    updateHints();
  }

  function insertProfile(prof) {
    const fr = focus && p.rows.find(r => r.id === focus.rowId);
    let target = fr && { row: fr, slot: focus.slot };
    if (!target || target.row[target.slot]) target = slotsOf(p).find(x => !x.pid);
    if (!target) return toast('Todas las asignaciones ya están cubiertas');
    assign(target.row, target.slot, prof.id);
    // Sigue con la siguiente vacía hacia abajo; si ya no hay, la primera vacía
    const all = slotsOf(p), at = all.findIndex(x => x.row === target.row && x.slot === target.slot);
    const next = all.slice(at + 1).find(x => !x.pid) || all.find(x => !x.pid);
    if (next) setFocus(next.row, next.slot);
  }

  // Lista desplegable al tocar un espacio: primero los más recomendados (mismos criterios que
  // el botón Sugerencias); al escribir, busca entre todos y dice por qué no se recomienda a otros.
  let pick = null; // { el, inp, row, slot, items, at }
  function closePick() { if (pick) { pick.el.remove(); pick = null; } }
  function openPick(row, slot, inp) {
    closePick();
    pick = { el: h('div', { class: 'pick', role: 'listbox' }), inp, row, slot, items: [], at: 0 };
    pick.el.style.top = (inp.offsetTop + inp.offsetHeight + 4) + 'px'; // justo debajo del campo
    // Al menos 260 px de ancho, pero sin salirse de la pantalla (en el celular la columna es angosta)
    const box = inp.parentNode.getBoundingClientRect(), width = Math.min(Math.max(box.width, 260), innerWidth - 16);
    const over = box.left + width - (innerWidth - 8);
    Object.assign(pick.el.style, { width: width + 'px', right: 'auto', left: (over > 0 ? -over : 0) + 'px' });
    inp.parentNode.append(pick.el);
    fillPick();
  }
  // Busca por el inicio de cada palabra del nombre: "ana" encuentra "Ana María", no "Hermana"
  const nameMatch = (name, typed) => (' ' + norm(name)).includes(' ' + typed);
  function fillPick() {
    const { row, slot, inp } = pick;
    const ctx = contextFor(p), counts = new Set(slotsOf(p).filter(x => x.pid && !(x.row === row && x.slot === slot)).map(x => x.pid));
    const current = row[slot], typed = current && profById(current) && profById(current).name === inp.value ? '' : norm(inp.value);
    const partner = slot === 'b' ? row.a : row.b;
    const best = candidatesFor(p, row, slot, ctx, counts, partner).filter(c => c.pr.id !== current);
    const priv = privFor(row, slot), rule = ruleFor(row), men = slotNeedsMen(row, slot);
    let items;
    if (!typed) items = best.slice(0, 8).map(c => ({ ...c, why: '' }));
    else {
      const shown = new Set();
      items = best.filter(c => nameMatch(c.pr.name, typed)).map(c => { shown.add(c.pr.id); return { ...c, why: '' }; });
      for (const pr of state.profiles) {
        if (shown.has(pr.id) || pr.id === current || !nameMatch(pr.name, typed)) continue;
        const l = ctx.last.get(pr.id);
        const why = counts.has(pr.id) ? 'Ya asignado esta semana' : ctx.recent.has(pr.id) ? 'Descansando'
          : !canDo(pr, priv) ? 'Sin privilegio' : men && pr.sex === 'F' ? 'Normalmente un varón' : 'Pareja de distinto sexo';
        items.push({ pr, rule, fits: fitsRule(pr, rule), days: l ? daysBetween(l.q.date, p.date) : Infinity, why });
      }
      items = items.slice(0, 30);
    }
    pick.items = items; pick.at = Math.min(pick.at, Math.max(items.length - 1, 0));
    pick.el.replaceChildren(
      h('div', { class: 'pick-head' }, typed ? 'Coincidencias' : `Recomendados${rule ? ` · filtro “${rule.nombre}”` : ''}`),
      ...(items.length ? items.map((it, i) => h('button', { class: 'pick-item' + (i === pick.at ? ' on' : '') + (it.why ? ' other' : ''),
        type: 'button', onmousedown: e => e.preventDefault(), onclick: () => choose(it.pr) },
        h('span', { class: 'nm' }, it.pr.name, ' ',
          h('small', null, `${it.pr.sex === 'M' ? '♂' : '♀'}${it.pr.age != null ? ' ' + it.pr.age : ''}`),
          it.rule && it.fits && !it.why ? h('span', { class: 'tag-fam' }, '✓ ' + it.rule.nombre) : null,
          it.why ? h('span', { class: 'tag-fam', style: { color: 'var(--orange)' } }, it.why) : null),
        h('span', { class: 'hint ' + (it.why ? 's-recent' : it.days === Infinity || it.days >= s.staleDays ? 's-stale' : 's-ok') },
          it.days === Infinity ? 'nunca' : `hace ${it.days} d`)))
        : [h('div', { class: 'pick-empty' }, typed ? 'Nadie con ese nombre. Al salir del campo se puede crear el perfil.' : 'Nadie disponible. Escribe un nombre para buscar entre todos.')]));
  }
  function choose(pr) {
    const { row, slot, inp } = pick;
    closePick();
    inp.value = pr.name;
    assign(row, slot, pr.id);
    inp.blur();
  }
  function pickKeys(e) {
    if (!pick) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      pick.at = Math.max(0, Math.min(pick.items.length - 1, pick.at + (e.key === 'ArrowDown' ? 1 : -1)));
      fillPick();
      const on = pick.el.querySelector('.on'); if (on) on.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && pick.items[pick.at]) {
      e.preventDefault(); choose(pick.items[pick.at].pr);
    } else if (e.key === 'Escape') closePick();
  }

  function slotNode(row, slot, label, soft) {
    const pid = row[slot];
    return h('div', { class: 'slot' },
      h('span', { class: 'slabel' + (soft ? ' soft' : '') }, label),
      h('div', { style: { position: 'relative' } },
        h('input', {
          type: 'text', autocomplete: 'off', value: pid && profById(pid) ? profById(pid).name : '',
          placeholder: 'Asignar…', 'data-row': row.id, 'data-slot': slot,
          onfocus: e => { setFocus(row, slot); openPick(row, slot, e.target); },
          onclick: e => { if (!pick) openPick(row, slot, e.target); },
          oninput: () => { if (pick) { pick.at = 0; fillPick(); } },
          onkeydown: pickKeys,
          onblur: () => setTimeout(() => { if (pick && document.activeElement !== pick.inp) closePick(); }, 150),
          onchange: e => {
            const val = squash(e.target.value);
            if (!val) return assign(row, slot, null);
            const prof = profByName(val);
            if (prof) return assign(row, slot, prof.id);
            openProfileDialog(null, { name: val, onSave: np => assign(row, slot, np.id), onCancel: () => assign(row, slot, row[slot]) });
          },
        }),
        h('div', { class: 'hint' }),
        h('div')));                // aquí sale la sugerencia del botón "Sugerencias"
  }

  function titleNode(row) {
    if (row.kind === 'prayer' || row.kind === 'song') {
      return h('div', { class: 'pt' }, `Canción ${row.song || '—'}`,
        h('span', { class: 'songname', 'data-song': row.song || '' }, row.song && state.songs[row.song] ? ' - ' + state.songs[row.song] : ''));
    }
    return [
      h('div', { class: 'pt' }, displayTitle(row), row.min ? h('span', { class: 'min' }, ` (${row.min} min.)`) : null),
      row.detail ? h('div', { class: 'detail', title: row.detail }, row.detail) : null,
    ];
  }

  function titleEditor(row) {
    if (row.kind === 'prayer' || row.kind === 'song') {
      return h('div', { class: 'edit-in' }, 'Canción n.º',
        h('input', { type: 'number', min: 1, value: row.song ?? '', onchange: e => {
          row.song = e.target.value === '' ? null : +e.target.value; rebuild(); ensureSongTitles([p]);
        } }));
    }
    return h('div', { class: 'edit-in' },
      h('input', { type: 'text', value: row.title, placeholder: 'Título de la intervención', oninput: e => { row.title = e.target.value; save(); } }),
      h('input', { type: 'number', min: 0, value: row.min ?? '', title: 'Minutos', onchange: e => { row.min = e.target.value === '' ? null : +e.target.value; rebuild(); } }),
      h('span', { class: 'muted small-text' }, 'min'));
  }

  function build() {
    closePick();
    const times = timesFor(p);
    const nodes = [];
    let sec = '';
    p.rows.forEach((row, i) => {
      if (row.section && row.section !== sec) {
        sec = row.section;
        const so = sectionOf(sec);
        nodes.push(h('div', { class: 'psec', style: { '--sec': so ? so.css : 'var(--sec-none)' } }, h('i'), sec));
      }
      const so = sectionOf(row.section);
      const lb = slotLabels(row);
      nodes.push(h('div', { class: 'prow' },
        h('div', { class: 'ptime' }, fmtTime(times[row.id])),
        h('div', { class: 'pdot', style: { background: so ? so.css : 'var(--sec-none)' } }),
        h('div', { class: 'ptitle' }, editing ? titleEditor(row) : titleNode(row)),
        h('div', { class: 'pslots' },
          isAssignable(row) ? [slotNode(row, 'a', lb.a, lb.soft), row.helper ? slotNode(row, 'b', lb.b, lb.soft) : null] : null),
        editing ? h('div', { class: 'pacts' },
          h('button', { class: 'btn icon small', title: 'Subir', disabled: i === 0,
            onclick: () => { [p.rows[i - 1], p.rows[i]] = [p.rows[i], p.rows[i - 1]]; rebuild(); } }, '↑'), ' ',
          h('button', { class: 'btn icon small', title: 'Bajar', disabled: i === p.rows.length - 1,
            onclick: () => { [p.rows[i + 1], p.rows[i]] = [p.rows[i], p.rows[i + 1]]; rebuild(); } }, '↓'), ' ',
          h('button', { class: 'btn icon small danger', title: 'Quitar', onclick: () => {
            if (confirm(`¿Quitar “${displayTitle(row)}”?`)) { p.rows.splice(i, 1); rebuild(); }
          } }, '×')) : h('div')));
    });
    body.replaceChildren(...nodes);
    heading.textContent = fmtMeeting(p) + (p.reading ? '  |  ' + p.reading.toUpperCase() : '');
    metaBox.replaceChildren(editing ? h('div', { class: 'meta' },
      h('label', { class: 'field' }, 'Semana', h('input', { type: 'text', value: p.title, oninput: e => { p.title = e.target.value; save(); } })),
      h('label', { class: 'field' }, 'Lectura de la Biblia', h('input', { type: 'text', value: p.reading || '', oninput: e => { p.reading = e.target.value; save(); heading.textContent = fmtMeeting(p) + (p.reading ? '  |  ' + p.reading.toUpperCase() : ''); } })),
      h('label', { class: 'field' }, 'Fecha de la reunión', h('input', { type: 'date', value: meetingDate(p), onchange: e => {
        if (!e.target.value) return;
        p.date = mondayOf(e.target.value); p.week = weekKey(p.date); rebuild();
      } }))) : '');
    toolbar.replaceChildren(...[
      editing ? h('button', { class: 'btn danger', onclick: () => {
        if (confirm(`¿Eliminar la semana “${p.title}”? Se perderán sus asignaciones.`)) { state.programs = state.programs.filter(x => x !== p); save(); go({ name: 'list' }); }
      } }, 'Eliminar semana') : null,
      editing ? null : h('button', { class: 'btn' + (suggesting ? ' primary' : ''), onclick: () => {
        suggesting = !suggesting; skips.clear(); build();
        if (suggesting) suggestBar.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } }, '✨ Sugerencias'),
      h('button', { class: 'btn', onclick: () => { editing = !editing; build(); } }, editing ? '✓ Listo' : '✎ Editar programa'),
      h('button', { class: 'btn', onclick: () => openSlipsDialog(p) }, '📄 Hojas de asignación'),
      h('button', { class: 'btn primary', onclick: () => downloadPDF([p]) }, '⬇ Programa PDF')].filter(Boolean));
    updateHints();
    if (focus) { const fr = p.rows.find(r => r.id === focus.rowId); if (fr && isAssignable(fr)) setFocus(fr, focus.slot); }
  }

  function addRow() {
    const sec = h('select', null, h('option', { value: '' }, '(sin sección)'), SECTIONS.map(x => h('option', { value: x.name }, x.name)));
    const title = h('input', { type: 'text', placeholder: 'Ej.: Necesidades de la congregación' });
    const min = h('input', { type: 'number', min: 0, value: 5, style: { width: '90px' } });
    const helper = h('select', null, h('option', { value: '' }, 'No'), h('option', { value: 'Ayudante' }, 'Ayudante'), h('option', { value: 'Lector' }, 'Lector'));
    const men = h('input', { type: 'checkbox' });
    const dlg = h('dialog', { class: 'dlg' },
      h('div', { class: 'dlg-body' }, h('h3', null, 'Agregar intervención'),
        h('label', { class: 'field' }, 'Título', title),
        h('div', { class: 'row', style: { gap: '16px' } },
          h('label', { class: 'field' }, 'Sección', sec), h('label', { class: 'field' }, 'Minutos', min), h('label', { class: 'field' }, '¿Con ayudante?', helper)),
        h('label', { class: 'row' }, men, 'La suele presentar un varón')),
      h('div', { class: 'dlg-foot' },
        h('button', { class: 'btn', onclick: () => dlg.close() }, 'Cancelar'),
        h('button', { class: 'btn primary', onclick: () => {
          const row = newRow('part', { section: sec.value, title: squash(title.value), min: min.value === '' ? null : +min.value, helper: helper.value || null, men: men.checked });
          // Al final de su sección; si no tiene sección, antes de las palabras de conclusión
          let at = -1;
          p.rows.forEach((r, i) => { if (row.section && r.section === row.section && r.kind === 'part') at = i; });
          if (at < 0) { const c = p.rows.findIndex(r => r.kind === 'chair' && !r.intro); at = c < 0 ? p.rows.length - 1 : c - 1; }
          p.rows.splice(at + 1, 0, row);
          dlg.close(); rebuild();
        } }, 'Agregar')));
    dlg.addEventListener('close', () => dlg.remove());
    document.body.append(dlg); dlg.showModal(); title.focus();
  }

  queueMicrotask(() => {
    build();
    const first = slotsOf(p).find(x => !x.pid) || slotsOf(p)[0];
    if (first) setFocus(first.row, first.slot);
    ensureSongTitles([p]);
  });

  const side = h('aside', { class: 'card side' },
    h('h3', null, 'Sugerencias'),
    suggFor,
    chips, privToggle, suggFilter, suggList,
    h('button', { class: 'btn small', style: { marginTop: '10px', width: '100%' }, onclick: () => openProfileDialog(null, { onSave: () => updateSide() }) }, '+ Nuevo perfil'));
  const grid = h('div', { class: 'editor' },
      h('div', { class: 'card sheet' },
        h('div', { class: 'ph1' }, h('span', null, s.pdfTitle || 'Programa'), s.congregation ? h('span', null, s.congregation) : null),
        heading,
        metaBox,
        suggestBar,
        body,
        h('div', { class: 'pfoot' },
          h('button', { class: 'btn small', onclick: addRow }, '+ Agregar intervención'), totalEl),
        h('div', { class: 'legend' },
          h('span', { class: 'hint s-recent' }, `↻ tiene otra asignación a menos de ${s.restDays} días`),
          h('span', { class: 'hint s-dup' }, '⚠ repetido en esta semana o revisar'),
          h('span', { class: 'hint s-stale' }, `★ ${s.staleDays}+ días sin participar o nunca`))),
      side);
  return h('div', null,
    h('div', { class: 'row spread', style: { marginBottom: '14px' } },
      h('button', { class: 'btn', onclick: () => go({ name: 'list' }) }, '← Semanas'),
      toolbar),
    grid);
}

function renderPeople() {
  let sort = 'stale', sexF = 'all';
  const filter = h('input', { type: 'search', placeholder: 'Buscar…', oninput: () => fill() });
  const tbody = h('tbody');
  const today = todayISO();

  function stats() {
    const progs = sortedPrograms();
    const recentPids = new Set(progs.filter(q => Math.abs(daysBetween(q.date, mondayOf(today))) < state.settings.restDays).flatMap(q => assignmentsOf(q).map(x => x.pid)));
    return state.profiles.map(pr => {
      let count = 0, last = null, next = null;
      for (const q of progs) for (const x of assignmentsOf(q)) {
        if (x.pid !== pr.id) continue;
        count++;
        if (q.date <= today) { if (!last) last = { q, ...x }; } else next = { q, ...x }; // progs va de más nuevo a más viejo
      }
      return { pr, count, last, next, days: last ? daysBetween(last.q.date, today) : Infinity, recent: recentPids.has(pr.id) };
    });
  }

  function fill() {
    const f = norm(filter.value);
    const byName = (a, b) => a.pr.name.localeCompare(b.pr.name, 'es');
    const rows = stats().filter(x => (!f || norm(x.pr.name).includes(f)) && (sexF === 'all' || x.pr.sex === sexF)).sort(
      sort === 'stale' ? (a, b) => b.days - a.days || byName(a, b)
        : sort === 'count' ? (a, b) => b.count - a.count || byName(a, b)
          : sort === 'age' ? (a, b) => (b.pr.age ?? -1) - (a.pr.age ?? -1) || byName(a, b) : byName);
    tbody.replaceChildren(...(rows.length ? rows.map(x => {
      const badge = x.days === Infinity ? ['s-never', x.next ? 'Programado' : 'Nunca']
        : x.days >= state.settings.staleDays ? ['s-stale', 'Hace mucho'] : x.recent ? ['s-recent', 'Reciente'] : ['s-ok', 'Normal'];
      return h('tr', { onclick: () => openProfileDialog(x.pr) },
        h('td', null, h('strong', null, x.pr.name),
          x.pr.tipo === 'reg' || x.pr.tipo === 'no' ? h('span', { class: 'tag-fam' }, x.pr.tipo === 'reg' ? 'Precursor regular' : 'No publicador') : null,
          Array.isArray(x.pr.puede)
            ? h('div', { class: 'muted small-text' }, x.pr.puede.length ? x.pr.puede.map(privLabel).join(' · ') : 'Sin asignaciones')
            : h('div', { class: 'small-text', style: { color: 'var(--orange)' } }, 'Privilegios sin marcar'),
          x.pr.notes ? h('div', { class: 'muted small-text' }, x.pr.notes) : null),
        h('td', null, x.pr.sex === 'M' ? 'Masculino' : 'Femenino'),
        h('td', null, x.pr.age ?? '—'),
        h('td', { class: 'small-text' }, (famOf(x.pr.id) || {}).name || '—'),
        h('td', null, x.count),
        h('td', null, x.last ? fmtShort(x.last.q.date) : '—'),
        h('td', null, x.days === Infinity ? '—' : `${x.days} días`),
        h('td', { class: 'small-text' }, x.last ? roleLabel(x.last.row, x.last.slot) : '—'),
        h('td', null, x.next ? fmtShort(x.next.q.date) : '—'),
        h('td', null, h('span', { class: 'badge ' + badge[0] }, badge[1])));
    }) : [h('tr', null, h('td', { colspan: 10, class: 'empty' }, state.profiles.length ? 'Ningún perfil coincide.' : 'Aún no hay perfiles. Pulsa “+ Nuevo perfil”.'))]));
  }

  fill();
  return h('div', null,
    h('div', { class: 'row spread', style: { marginBottom: '14px' } },
      h('div', null, h('h1', null, 'Perfiles'),
        h('p', { class: 'sub', style: { margin: 0 } }, 'Ordenados por el tiempo que llevan sin participar. Toca un perfil para editarlo o ver su historial.')),
      h('button', { class: 'btn primary', onclick: () => openProfileDialog(null) }, '+ Nuevo perfil')),
    h('div', { class: 'card', style: { padding: '14px' } },
      h('div', { class: 'row', style: { marginBottom: '10px' } }, filter,
        h('select', { onchange: e => { sexF = e.target.value; fill(); } },
          h('option', { value: 'all' }, 'Todos'), h('option', { value: 'M' }, 'Hombres'), h('option', { value: 'F' }, 'Mujeres')),
        h('select', { onchange: e => { sort = e.target.value; fill(); } },
          h('option', { value: 'stale' }, 'Más tiempo sin participar'),
          h('option', { value: 'count' }, 'Más veces asignado'),
          h('option', { value: 'age' }, 'Edad'),
          h('option', { value: 'az' }, 'Alfabético'))),
      h('div', { class: 'tablewrap' }, h('table', { class: 'stats' },
        h('thead', null, h('tr', null, ['Nombre', 'Sexo', 'Edad', 'Familia', 'Veces', 'Última vez', 'Hace', 'Última asignación', 'Próxima', 'Estado'].map(t => h('th', null, t)))),
        tbody))));
}

function openFamilyDialog(fam) {
  const nameI = h('input', { type: 'text', value: fam ? fam.name : '', placeholder: 'Ej.: Familia Tapia' });
  const err = h('div', { class: 'err' });
  const dlg = h('dialog', { class: 'dlg' },
    h('div', { class: 'dlg-body' },
      h('h3', null, fam ? 'Cambiar nombre' : 'Nueva familia'),
      h('label', { class: 'field' }, 'Nombre de la familia', nameI), err),
    h('div', { class: 'dlg-foot' },
      h('button', { class: 'btn', onclick: () => dlg.close() }, 'Cancelar'),
      h('button', { class: 'btn primary', onclick: submit }, 'Guardar')));
  function submit() {
    const name = squash(nameI.value);
    if (!name) return err.textContent = 'Escribe el nombre de la familia.';
    if (state.families.some(f => f !== fam && norm(f.name) === norm(name))) return err.textContent = 'Ya existe una familia con ese nombre.';
    if (fam) fam.name = name; else state.families.push({ id: uid(), name });
    save(); dlg.close(); render();
  }
  dlg.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
  dlg.addEventListener('close', () => dlg.remove());
  document.body.append(dlg); dlg.showModal(); nameI.focus();
}

function renderFamilies() {
  const fams = [...state.families].sort((a, b) => a.name.localeCompare(b.name, 'es'));
  const free = state.profiles.filter(p => !p.familyId || !famById(p.familyId)).sort((a, b) => a.name.localeCompare(b.name, 'es'));
  const card = f => {
    const members = familyMembers(f);
    return h('div', { class: 'card fam' },
      h('div', { class: 'fam-head' },
        h('strong', null, f.name),
        h('div', { class: 'row' },
          h('button', { class: 'btn small', onclick: () => openFamilyDialog(f) }, 'Renombrar'),
          h('button', { class: 'btn small danger', onclick: () => {
            if (!confirm(`¿Eliminar “${f.name}”? Los perfiles no se borran, solo dejan de estar en esta familia.`)) return;
            state.families = state.families.filter(x => x !== f);
            for (const p of state.profiles) if (p.familyId === f.id) p.familyId = null;
            save(); render();
          } }, 'Eliminar'))),
      members.length ? h('div', { class: 'members' }, members.map(m => h('span', { class: 'member' },
        m.name, h('small', null, `${m.sex === 'M' ? '♂' : '♀'}${m.age != null ? ' ' + m.age : ''}`),
        h('button', { title: 'Quitar de la familia', onclick: () => { m.familyId = null; save(); render(); } }, '×'))))
        : h('div', { class: 'muted small-text' }, 'Todavía no tiene miembros.'),
      free.length ? h('select', { onchange: e => {
        const pr = profById(e.target.value); if (!pr) return;
        pr.familyId = f.id; save(); render();
      } }, h('option', { value: '' }, '+ Agregar miembro…'), free.map(p => h('option', { value: p.id }, p.name)))
        : h('div', { class: 'muted small-text' }, state.profiles.length ? 'Todos los perfiles ya tienen familia.' : 'Primero crea perfiles en la pestaña “Perfiles”.'));
  };
  return h('div', null,
    h('div', { class: 'row spread', style: { marginBottom: '14px' } },
      h('div', null, h('h1', null, 'Familias'),
        h('p', { class: 'sub', style: { margin: 0 } },
          'Agrupa a las personas que son familia. Al elegir ayudante, la app muestra primero a los familiares y avisa si la pareja es de distinto sexo y no es de la misma familia.')),
      h('button', { class: 'btn primary', onclick: () => openFamilyDialog(null) }, '+ Nueva familia')),
    fams.length ? h('div', { class: 'fgrid' }, fams.map(card))
      : h('div', { class: 'card empty' }, 'Aún no hay familias. Pulsa “+ Nueva familia” para crear la primera.'));
}

function renderSettings() {
  const s = state.settings;
  const num = (label, key, min, max) => h('label', { class: 'field' }, label,
    h('input', { type: 'number', min, max, value: s[key], style: { width: '120px' }, onchange: e => { s[key] = Math.min(max, Math.max(min, Math.round(+e.target.value) || min)); e.target.value = s[key]; save(); } }));
  const text = (label, key, ph) => h('label', { class: 'field' }, label,
    h('input', { type: 'text', value: s[key], placeholder: ph, oninput: e => { s[key] = e.target.value; save(); } }));
  const fileIn = h('input', { type: 'file', accept: '.json,application/json', style: { display: 'none' }, onchange: e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(txt => {
      const data = JSON.parse(txt);
      if (!Array.isArray(data.programs) || !Array.isArray(data.profiles)) throw new Error();
      if (!confirm(FB_CONFIG ? 'Esto reemplazará todos los datos de la congregación por los del respaldo. ¿Continuar?'
        : 'Esto reemplazará todos los datos actuales por los del respaldo. ¿Continuar?')) return;
      state = hydrate(data); save(); toast('Respaldo cargado'); go({ name: 'list' });
    }).catch(() => toast('El archivo no es un respaldo válido de esta app'));
    e.target.value = '';
  } });
  // Versión del programa de escritorio (se actualiza solo desde GitHub)
  const version = h('p', { class: 'sub' });
  if (location.protocol === 'app:') fetch('/version').then(r => r.text()).then(v => { version.textContent = `Versión ${v} · se actualiza sola al abrir el programa`; }).catch(() => {});
  else if (FB_CONFIG) version.textContent = `Versión ${APP_VERSION} (web)`;
  return h('div', null,
    h('h1', null, 'Ajustes'),
    h('p', { class: 'sub' }, FB_CONFIG ? 'Los datos se guardan en la nube de la congregación; solo los administradores los ven completos.'
      : 'Los datos se guardan en este navegador. Descarga un respaldo de vez en cuando.'),
    FB_CONFIG ? accountCard() : null,
    FB_CONFIG && isAdmin() ? congregationSettings() : null,
    FB_CONFIG ? h('h2', { class: 'group' }, 'Reunión y PDF') : null,
    h('div', { class: 'card settings' },
      text('Título del programa', 'pdfTitle', 'Programa para la reunión de entre semana'),
      FB_CONFIG ? null : text('Nombre de la congregación', 'congregation', 'Opcional'),
      h('div', { class: 'row', style: { gap: '20px', alignItems: 'flex-end' } },
        h('label', { class: 'field' }, 'Día de la reunión',
          h('select', { onchange: e => { s.meetingDay = +e.target.value; save(); } },
            WEEKDAYS.map((d, i) => h('option', { value: i, selected: s.meetingDay === i ? true : null }, d)))),
        h('label', { class: 'field' }, 'Hora de inicio',
          h('input', { type: 'time', value: s.startTime, onchange: e => { if (e.target.value) { s.startTime = e.target.value; save(); } } })),
        h('label', { class: 'field' }, 'Tamaño de papel del PDF',
          h('select', { onchange: e => { s.paper = e.target.value; save(); } },
            h('option', { value: 'letter', selected: s.paper !== 'a4' ? true : null }, 'Carta'),
            h('option', { value: 'a4', selected: s.paper === 'a4' ? true : null }, 'A4')))),
      h('label', { class: 'field' }, 'Nota al estudiante (en las hojas de asignación)',
        h('textarea', { rows: 3, oninput: e => { s.slipNote = e.target.value; save(); } }, s.slipNote)),
      text('Texto al pie de las hojas de asignación', 'slipFooter', 'Opcional (por ejemplo, el código del formulario)'),
      num('No repetir a nadie en … días (antes o después de su asignación)', 'restDays', 7, 120),
      num('Marcar como “hace mucho” después de … días', 'staleDays', 1, 3650),
      num('Cuántas semanas hacia adelante buscar en jw.org', 'weeksAhead', 1, 16),
      h('div', { class: 'row' },
        h('button', { class: 'btn', onclick: () => {
          const a = h('a', { href: URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' })),
            download: `respaldo-programas-${todayISO()}.json` });
          a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        } }, '⬇ Descargar respaldo'),
        h('button', { class: 'btn', onclick: () => fileIn.click() }, '⬆ Cargar respaldo'), fileIn)),
    filtersCard(),
    version);
}

// Ajustes: filtros de sugerencias (palabras de la parte → edad y sexo preferidos)
function filtersCard() {
  const s = state.settings;
  if (!Array.isArray(s.filters)) s.filters = DEFAULT_FILTERS.map(f => ({ ...f }));
  const box = h('div', { style: { display: 'grid', gap: '10px' } });
  const ageIn = (f, key) => h('input', { type: 'number', min: 0, max: 120, value: f[key] ?? '', placeholder: '—', style: { width: '74px' },
    onchange: e => { f[key] = e.target.value === '' ? null : Math.max(0, Math.round(+e.target.value)); save(); } });
  function fill() {
    box.replaceChildren(...(s.filters.length ? s.filters.map((f, i) => h('div', { class: 'card', style: { padding: '12px', display: 'grid', gap: '8px', boxShadow: 'none' } },
      h('div', { class: 'row', style: { gap: '12px', alignItems: 'flex-end' } },
        h('label', { class: 'field', style: { flex: '1', minWidth: '140px' } }, 'Nombre',
          h('input', { type: 'text', value: f.nombre, oninput: e => { f.nombre = e.target.value; save(); } })),
        h('label', { class: 'field' }, 'Edad desde', ageIn(f, 'min')),
        h('label', { class: 'field' }, 'hasta', ageIn(f, 'max')),
        h('label', { class: 'field' }, 'Sexo', h('select', { onchange: e => { f.sexo = e.target.value; save(); } },
          [['', 'Cualquiera'], ['M', 'Hombres'], ['F', 'Mujeres']].map(([v, t]) => h('option', { value: v, selected: (f.sexo || '') === v ? true : null }, t)))),
        h('button', { class: 'btn small danger', onclick: () => { if (confirm(`¿Quitar el filtro “${f.nombre}”?`)) { s.filters.splice(i, 1); save(); fill(); } } }, 'Quitar')),
      h('label', { class: 'field' }, 'Palabras que lo activan (separadas por comas)',
        h('input', { type: 'text', value: f.palabras, placeholder: 'Ej.: escuela, compañero de clase', oninput: e => { f.palabras = e.target.value; save(); } }))))
      : [h('div', { class: 'muted' }, 'No hay filtros.')]));
  }
  fill();
  return [
    h('h2', { class: 'group' }, 'Filtros de sugerencias'),
    h('div', { class: 'card settings', style: { marginTop: 0 } },
      h('p', { class: 'muted small-text', style: { margin: 0 } },
        'Si el título o la descripción de una parte tiene alguna de estas palabras, las sugerencias ponen primero a quien tenga esa edad. Para que funcionen, los perfiles necesitan tener la edad.'),
      box,
      h('div', { class: 'row' },
        h('button', { class: 'btn small', onclick: () => { s.filters.push({ nombre: 'Nuevo filtro', palabras: '', min: null, max: null, sexo: '' }); save(); fill(); } }, '+ Agregar filtro'),
        h('button', { class: 'btn small', onclick: () => {
          if (!confirm('¿Volver a los filtros que trae la app? Se pierden los cambios que hayas hecho.')) return;
          s.filters = DEFAULT_FILTERS.map(f => ({ ...f })); save(); fill();
        } }, 'Volver a los predeterminados')))];
}

// Revisa jw.org al abrir, como máximo cada 12 horas (o siempre si faltan semanas próximas).
// En la versión web no se puede leer jw.org, así que no se intenta solo.
function startJw() {
  if (location.protocol === 'https:') return;
  if (Date.now() - state.lastSync > 12 * 36e5 || !state.programs.some(p => p.date >= mondayOf(todayISO()))) syncGuides(false);
  else ensureSongTitles(state.programs);
}
if (/^#ver&/.test(location.hash)) renderSharedTerritory(); // QR de una tarjeta de territorio
else if (FB_CONFIG) startCloud();
else { render(); startJw(); }
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  // Cuando llega una versión nueva de la web, se recarga una vez para usarla
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !busy()) location.reload(); });
  // Si la página se queda abierta (o la app del celular en segundo plano), revisa al volver a ella
  // y cada 15 minutos; si hay versión nueva, el evento de arriba la recarga.
  navigator.serviceWorker.register('sw.js').then(reg => {
    const check = () => reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
    setInterval(check, 15 * 6e4);
  }).catch(() => {});
}
