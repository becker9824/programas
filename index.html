<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programas y Asignaciones</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#0070c0">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="vendor/jspdf.umd.min.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root {
    --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f0f2f5; --border: #e2e5ea;
    --text: #1d2330; --muted: #6b7380; --accent: #0070c0; --accent-text: #ffffff;
    --red: #c62828; --red-bg: #fdecec; --orange: #b45309; --orange-bg: #fff4e0;
    --green: #1b7a3d; --green-bg: #e7f6ec; --shadow: 0 1px 3px rgba(0,0,0,.07);
    --sec-none: #575a5d; --sec-tesoros: #3c7f8b; --sec-maestros: #be8900; --sec-vida: #7e0024;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --surface: #1b1f27; --surface-2: #232834; --border: #303746;
      --text: #e7eaf0; --muted: #98a2b3; --accent: #4ea3e6; --accent-text: #0b1020;
      --red: #ff8a80; --red-bg: #3a1d1d; --orange: #ffc266; --orange-bg: #3a2c14;
      --green: #7ddc9b; --green-bg: #173123; --shadow: none;
      --sec-none: #9aa1a8; --sec-tesoros: #5fb3c1; --sec-maestros: #e0aa2e; --sec-vida: #e0607e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  .bar { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 17px; margin-right: auto; }
  nav { display: flex; gap: 4px; }
  nav button { background: none; border: 0; color: var(--muted); padding: 8px 12px; border-radius: 8px; font: inherit; cursor: pointer; }
  nav button.active { background: var(--surface-2); color: var(--text); font-weight: 600; }
  main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2.group { font-size: 15px; color: var(--muted); margin: 22px 0 8px; font-weight: 600; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); padding: 7px 12px; border-radius: 8px; font: inherit; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .btn.danger { color: var(--red); }
  .btn.small { padding: 3px 8px; font-size: 13px; }
  .btn.icon { padding: 3px 7px; min-width: 28px; justify-content: center; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .spread { justify-content: space-between; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
  input[type=text], input[type=email], input[type=password], input[type=date], input[type=time], input[type=number], input[type=search], select, textarea {
    font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; min-width: 0; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .muted { color: var(--muted); }
  .small-text { font-size: 12px; }

  .notice { padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 14px; }
  .notice.warn { background: var(--orange-bg); color: var(--orange); }
  .sync { padding: 12px 16px; margin-bottom: 14px; }

  .plist { display: grid; gap: 8px; }
  .pitem { padding: 12px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .pitem .info { flex: 1; min-width: 200px; cursor: pointer; }
  .pitem .t { font-weight: 600; }
  .pitem .d { color: var(--muted); font-size: 13px; }
  .progress { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .progress.done { background: var(--green-bg); color: var(--green); }
  .empty { padding: 32px 16px; text-align: center; color: var(--muted); }

  /* ---- Programa semanal ---- */
  .editor { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .editor { grid-template-columns: 1fr; } }
  .sheet { padding: 22px 26px 18px; }
  @media (max-width: 640px) { .sheet { padding: 16px 14px; } }
  .ph1 { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-weight: 700; font-size: 18px;
    padding-bottom: 8px; border-bottom: 2px solid var(--text); }
  .ph2 { color: var(--accent); font-weight: 700; font-size: 17px; margin: 12px 0 6px; }
  .meta { display: grid; grid-template-columns: 2fr 2fr 1fr; gap: 10px; margin: 10px 0; padding: 12px; background: var(--surface-2); border-radius: 10px; }
  @media (max-width: 640px) { .meta { grid-template-columns: 1fr; } }
  .psec { display: flex; align-items: center; gap: 9px; color: var(--sec); font-weight: 700; font-size: 15px; letter-spacing: .03em;
    text-transform: uppercase; padding: 16px 0 6px; border-bottom: 2px solid var(--sec); margin-bottom: 2px; }
  .psec i { width: 16px; height: 16px; border-radius: 4px; background: var(--sec); display: inline-block; }
  .prow { display: grid; grid-template-columns: 46px 10px minmax(0, 1fr) minmax(240px, 340px) auto; gap: 10px;
    align-items: start; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .prow:last-child { border-bottom: 0; }
  .ptime { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; padding-top: 7px; }
  .pdot { width: 8px; height: 8px; border-radius: 50%; margin-top: 13px; }
  .ptitle { padding-top: 6px; min-width: 0; }
  .ptitle .pt { font-weight: 500; }
  .ptitle .min { color: var(--muted); font-weight: 400; white-space: nowrap; }
  .ptitle .songname { color: var(--muted); }
  .detail { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pslots { display: grid; gap: 6px; }
  .slot { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 8px; align-items: start; }
  .slabel { text-align: right; font-weight: 600; font-size: 13px; padding-top: 8px; }
  .slabel.soft { font-weight: 400; color: var(--muted); }
  .slot input { width: 100%; }
  .edit-in { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .edit-in input[type=text] { flex: 1; min-width: 160px; }
  .edit-in input[type=number] { width: 70px; }
  .pacts { white-space: nowrap; padding-top: 4px; }
  @media (max-width: 700px) {
    .prow { grid-template-columns: 40px 10px minmax(0, 1fr); }
    .pslots, .pacts { grid-column: 3; }
  }
  .pfoot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 12px; }
  .total { font-size: 13px; color: var(--muted); }
  .hint { font-size: 12px; margin-top: 3px; padding: 2px 6px; border-radius: 6px; display: inline-block; }
  .hint:empty { display: none; }
  .s-dup, .s-warn { background: var(--orange-bg); color: var(--orange); }
  .s-recent { background: var(--red-bg); color: var(--red); }
  .s-stale, .s-never { background: var(--green-bg); color: var(--green); }
  .s-ok { color: var(--muted); }
  input.s-recent, input.s-dup, input.s-warn { border-color: currentColor; }
  input.focused { outline: 2px solid var(--accent); outline-offset: -1px; }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; margin-top: 10px; }

  .side { padding: 14px; position: sticky; top: 70px; }
  .side h3 { margin: 0 0 4px; font-size: 15px; }
  .side p { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
  .side input[type=search] { width: 100%; margin-bottom: 8px; }
  .chips { display: flex; gap: 4px; margin-bottom: 8px; }
  .chips button { flex: 1; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px;
    padding: 4px 6px; font: inherit; font-size: 13px; cursor: pointer; }
  .chips button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .sugg { display: flex; flex-direction: column; gap: 2px; max-height: 58vh; overflow-y: auto; }
  .sugg button { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: none; border: 0; text-align: left;
    padding: 6px 8px; border-radius: 6px; font: inherit; color: var(--text); cursor: pointer; }
  .sugg button:hover { background: var(--surface-2); }
  .sugg .nm small { color: var(--muted); }

  table.stats { width: 100%; border-collapse: collapse; }
  table.stats th, table.stats td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; }
  table.stats th { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  table.stats tbody tr { cursor: pointer; }
  table.stats tbody tr:hover { background: var(--surface-2); }
  .tablewrap { overflow-x: auto; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }

  dialog.dlg { border: 1px solid var(--border); border-radius: 14px; padding: 0; width: min(520px, calc(100vw - 32px));
    background: var(--surface); color: var(--text); }
  dialog.dlg::backdrop { background: rgba(0,0,0,.4); }
  .dlg-body { padding: 18px; display: grid; gap: 12px; }
  .dlg-body h3 { margin: 0; }
  .dlg-foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .radios { display: flex; gap: 16px; color: var(--text); font-size: 15px; }
  .radios label { display: flex; gap: 6px; align-items: center; }
  .err { color: var(--red); font-size: 13px; }
  .err:empty { display: none; }
  .hist { max-height: 200px; overflow-y: auto; font-size: 13px; border-top: 1px solid var(--border); padding-top: 8px; }
  .hist div { padding: 3px 0; display: flex; justify-content: space-between; gap: 12px; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 10px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; }
  .settings { padding: 16px; display: grid; gap: 16px; max-width: 620px; }

  .fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .fam { padding: 14px; display: grid; gap: 10px; align-content: start; }
  .fam-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .fam-head strong { font-size: 16px; }
  .members { display: flex; flex-wrap: wrap; gap: 6px; }
  .member { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 999px;
    padding: 4px 4px 4px 10px; font-size: 14px; }
  .member small { color: var(--muted); }
  .member button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1;
    width: 22px; height: 22px; border-radius: 50%; }
  .member button:hover { background: var(--border); color: var(--red); }
  .fam select { width: 100%; }
  .slips { display: grid; gap: 2px; max-height: 50vh; overflow-y: auto; border-top: 1px solid var(--border); padding-top: 6px; }
  .slip { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 4px;
    border-radius: 8px; cursor: pointer; }
  .slip:hover { background: var(--surface-2); }
  .slip > span { display: flex; flex-direction: column; min-width: 0; }
  .slip small { color: var(--muted); font-size: 12px; }
  .tag-fam { font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--surface-2); color: var(--accent); margin-left: 4px; }

  /* ---- Congregación: acceso, publicadores, usuarios e informes ---- */
  nav { overflow-x: auto; max-width: 100%; }
  @media (max-width: 640px) { .brand { width: 100%; } nav button { padding: 8px 9px; } }
  .auth { min-height: 70vh; display: grid; place-items: center; }
  .auth-card { width: min(440px, 100%); padding: 22px; display: grid; gap: 14px; }
  .auth-card h2 { margin: 0; font-size: 20px; }
  .auth-card p { margin: 0; }
  .auth-card input { width: 100%; }
  .linkbtn { background: none; border: 0; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; padding: 0; justify-self: start; }
  .tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 10px; }
  .tabs button { flex: 1; border: 0; background: none; padding: 7px 6px; border-radius: 8px; font: inherit; font-size: 13px; color: var(--muted); cursor: pointer; }
  .tabs button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
  .mine { padding: 16px; margin-bottom: 16px; border-left: 4px solid var(--accent); display: grid; gap: 4px; }
  .mine-t { font-size: 18px; font-weight: 700; }
  .vweek { margin-bottom: 10px; }
  .vweek summary { padding: 12px 14px; cursor: pointer; }
  .vbody { padding: 0 14px 12px; }
  .vrow { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .vrow:last-child { border-bottom: 0; }
  .vrow .ptime { padding-top: 0; }
  .vnames { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 14px; color: var(--muted); margin-top: 2px; }
  .vnames .yo { color: var(--accent); font-weight: 700; }
  .urow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .urow:last-child { border-bottom: 0; }
  .urow .info { flex: 1; min-width: 180px; }
  .code { font: 700 22px ui-monospace, Consolas, monospace; letter-spacing: .15em; }
  .totals { display: flex; gap: 18px; flex-wrap: wrap; margin: 4px 0 10px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">📋 Programas</div>
    <nav></nav>
  </div>
</header>
<main id="app"></main>
<datalist id="profiles-list"></datalist>
<div class="toast" id="toast"></div>

<script>
const KEY = 'programas-app-v2';
const APP_VERSION = '1.3.1'; // igual que "version" en package.json (publicar.ps1 lo revisa)
// Con FIREBASE_CONFIG (firebase-config.js) los datos viven en la nube de la congregación;
// sin él, la app funciona como antes, solo en esta PC. "?emu" usa el Firebase local de prueba.
const EMU = /[?&]emu\b/.test(location.search);
const FB_CONFIG = EMU ? { apiKey: 'demo-key', authDomain: 'localhost', projectId: 'demo-programas' } : window.FIREBASE_CONFIG;
const OLD_PDF_TITLE = 'Reunión Vida y Ministerio Cristianos';
const defaults = () => ({
  profiles: [], families: [], programs: [], songs: {}, missing: {}, lastSync: 0,
  settings: {
    staleDays: 60, recentCount: 2, weeksAhead: 8, congregation: '',
    pdfTitle: 'Programa para la reunión de entre semana', meetingDay: 2, startTime: '19:00', paper: 'letter',
    slipNote: 'En la Guía de actividades está la información para preparar su intervención. Repase también las indicaciones para la reunión Vida y Ministerio Cristianos.',
    slipFooter: '',
  },
});
const SECTIONS = [
  { key: 'tesoros', name: 'Tesoros de la Biblia', css: 'var(--sec-tesoros)', rgb: [60, 127, 139] },
  { key: 'maestros', name: 'Seamos mejores maestros', css: 'var(--sec-maestros)', rgb: [190, 137, 0] },
  { key: 'vida cristiana', name: 'Nuestra vida cristiana', css: 'var(--sec-vida)', rgb: [126, 0, 36] },
];
const WEEKDAYS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];

function hydrate(s) {
  const d = defaults();
  const out = { ...d, ...s, songs: { ...(s && s.songs) }, settings: { ...d.settings, ...(s && s.settings) } };
  if (out.settings.pdfTitle === OLD_PDF_TITLE) out.settings.pdfTitle = d.settings.pdfTitle;
  for (const p of out.programs) migrateProgram(p);
  return out;
}
// Programas guardados con la versión anterior: el presidente pasa a "Palabras de introducción"
// y las canciones guardan su número.
function migrateProgram(p) {
  const role = p.rows.find(r => r.kind === 'role');
  const intro = p.rows.find(r => r.kind === 'chair' && /introducci/i.test(r.title));
  if (intro) intro.intro = true;
  if (role) { if (intro && !intro.a) intro.a = role.a; p.rows = p.rows.filter(r => r !== role); }
  if (p.source === 'jw' && !p.rows.some(r => r.num)) { let n = 0; for (const r of p.rows) if (r.kind === 'part') r.num = ++n; }
  for (const r of p.rows) {
    if (r.kind === 'part' && /\)$/.test(r.title || '') && r.detail) r.detail = r.detail.replace(/^[A-ZÁÉÍÓÚÑÜ][A-ZÁÉÍÓÚÑÜ ]{3,}\.\s*/, '');
    if ((r.kind === 'prayer' || r.kind === 'song') && r.song == null) {
      const m = (r.title || '').match(/canci[oó]n\s+(\d+)/i);
      r.song = m ? +m[1] : null;
    }
  }
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.programs)) return hydrate(s); } catch (e) {}
  return defaults();
}
function save() {
  if (FB_CONFIG) return saveCloud();
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { toast('No se pudo guardar en este navegador'); }
}
let state = FB_CONFIG ? defaults() : load();
let view = { name: 'list' };
let syncMsg = { text: '', warn: false };
let syncing = false;
let serverOK = null;

// ---------- utilidades ----------
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') {
      for (const [sk, sv] of Object.entries(v)) sk.startsWith('--') ? el.style.setProperty(sk, sv) : (el.style[sk] = sv);
    }
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const toDate = iso => new Date(iso + 'T12:00:00');
function addDays(iso, n) { const d = toDate(iso); d.setDate(d.getDate() + n); return isoOf(d); }
const daysBetween = (a, b) => Math.round((toDate(b) - toDate(a)) / 864e5);
const fmtShort = iso => iso ? toDate(iso).toLocaleDateString('es', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtDay = iso => iso ? toDate(iso).toLocaleDateString('es', { day: 'numeric', month: 'long' }) : '';
const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').trim().replace(/\s+/g, ' ').toLowerCase();
const squash = s => (s || '').replace(/[\s ]+/g, ' ').trim();
const capFirst = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const titleCase = s => s.toLowerCase().replace(/(^|[\s(])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());

// Semanas ISO (las que usa wol.jw.org)
function thursdayOf(iso) { const d = toDate(iso); d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + 3); return d; }
function isoWeek(iso) {
  const thu = thursdayOf(iso);
  const first = thursdayOf(`${thu.getFullYear()}-01-04`);
  return { y: thu.getFullYear(), w: 1 + Math.round((thu - first) / (7 * 864e5)) };
}
const mondayOf = iso => addDays(iso, -((toDate(iso).getDay() + 6) % 7));
const weekKey = iso => { const { y, w } = isoWeek(iso); return `${y}-W${pad(w)}`; };
function weekLabel(monday) {
  const end = addDays(monday, 6), a = toDate(monday), b = toDate(end);
  const month = d => d.toLocaleDateString('es', { month: 'long' });
  return a.getMonth() === b.getMonth() ? `${a.getDate()}-${b.getDate()} de ${month(a)}` : `${a.getDate()} de ${month(a)} a ${b.getDate()} de ${month(b)}`;
}
const meetingDate = p => addDays(p.date, state.settings.meetingDay);
const fmtMeeting = p => capFirst(toDate(meetingDate(p)).toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }));
function fmtTime(m) { const h24 = Math.floor(m / 60) % 24; return `${((h24 + 11) % 12) + 1}:${pad(m % 60)}`; }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

// ---------- intervenciones ----------
const sectionOf = name => SECTIONS.find(s => s.name === name);
const isAssignable = r => r.kind === 'prayer' || r.kind === 'part' || (r.kind === 'chair' && r.intro);
const hasCounsel = r => r.kind === 'part' && (r.section === SECTIONS[1].name || /lectura de la biblia/i.test(r.title));
const songText = r => r.song ? `Canción ${r.song}${state.songs[r.song] ? ' - ' + state.songs[r.song] : ''}` : 'Canción';

function displayTitle(r) {
  if (r.kind === 'prayer' || r.kind === 'song') return songText(r);
  return (r.num ? r.num + '. ' : '') + (r.title || 'Intervención');
}
function slotLabels(r) {
  if (r.kind === 'prayer') return { a: 'Oración' };
  if (r.kind === 'chair') return { a: 'Presidente' };
  if (r.helper === 'Lector') return { a: 'Conductor', b: 'Lector' };
  if (r.helper === 'Ayudante') return { a: 'Estudiante', b: 'Ayudante', soft: true };
  return { a: '' };
}
function slotNeedsMen(r, slot) {
  if (r.kind === 'prayer' || r.kind === 'chair') return true;
  if (slot === 'b') return r.helper === 'Lector';
  return !!r.men;
}
const roleLabel = (r, slot) => slot === 'b' ? `${r.helper}: ${displayTitle(r)}`
  : r.kind === 'prayer' ? 'Oración' : r.kind === 'chair' ? 'Presidente' : displayTitle(r);

// Horario: canción y oración inicial 5 min, canción intermedia 4 min, 1 min de consejo tras cada
// intervención de estudiante; la canción final queda a los 100 minutos del inicio.
function timesFor(p) {
  const [hh, mm] = (state.settings.startTime || '19:00').split(':').map(Number);
  const start = hh * 60 + mm;
  let t = start, prayers = 0;
  const out = {};
  for (const r of p.rows) {
    if (r.kind === 'prayer' && prayers > 0) t = Math.max(t, start + 100);
    out[r.id] = t;
    if (r.kind === 'prayer') { t += 5; prayers++; }
    else if (r.kind === 'song') t += 4;
    else t += (+r.min || 0) + (hasCounsel(r) ? 1 : 0);
  }
  out.end = t;
  return out;
}

// ---------- perfiles y asignaciones ----------
const profById = id => state.profiles.find(p => p.id === id);
const profByName = name => state.profiles.find(p => norm(p.name) === norm(name));
const famById = id => state.families.find(f => f.id === id);
const famOf = pid => { const pr = profById(pid); return pr && pr.familyId ? famById(pr.familyId) : null; };
const sameFamily = (a, b) => { const f = famOf(a); return !!f && f === famOf(b); };
const familyMembers = fam => state.profiles.filter(p => p.familyId === fam.id).sort((a, b) => a.name.localeCompare(b.name, 'es'));
const sortedPrograms = () => [...state.programs].sort((a, b) => b.date.localeCompare(a.date));

function slotsOf(p) {
  const out = [];
  for (const row of p.rows) {
    if (!isAssignable(row)) continue;
    out.push({ row, slot: 'a', pid: row.a });
    if (row.helper) out.push({ row, slot: 'b', pid: row.b });
  }
  return out;
}
const assignmentsOf = p => slotsOf(p).filter(x => x.pid && profById(x.pid));

// Cuántas intervenciones tiene cada persona en la semana. Que el presidente haga
// también la oración inicial es normal, así que no cuenta como repetido.
function countsFor(p) {
  const counts = {};
  const intro = p.rows.find(r => r.kind === 'chair' && r.intro);
  const firstPrayer = p.rows.find(r => r.kind === 'prayer');
  for (const x of slotsOf(p)) {
    if (!x.pid) continue;
    if (x.row === firstPrayer && intro && intro.a === x.pid) continue;
    counts[x.pid] = (counts[x.pid] || 0) + 1;
  }
  return counts;
}

function contextFor(p) {
  const priors = sortedPrograms().filter(q => q !== p && q.date <= p.date);
  const last = new Map();
  for (const q of priors) for (const x of assignmentsOf(q)) if (!last.has(x.pid)) last.set(x.pid, { q, ...x });
  const recent = new Map();
  for (const q of priors.slice(0, state.settings.recentCount)) for (const x of assignmentsOf(q)) if (!recent.has(x.pid)) recent.set(x.pid, { q, ...x });
  return { last, recent };
}

function statusFor(pid, p, ctx, counts, row, slot) {
  const prof = profById(pid);
  if (!prof) return { cls: 's-warn', text: 'Perfil eliminado' };
  if (counts[pid] > 1) return { cls: 's-dup', text: '⚠ Ya tiene otra intervención en esta semana' };
  if (slotNeedsMen(row, slot) && prof.sex === 'F') return { cls: 's-warn', text: '⚠ Normalmente la asigna un varón' };
  if (row.helper === 'Ayudante') {
    const other = profById(row[slot === 'a' ? 'b' : 'a']);
    if (other && other.sex !== prof.sex && !sameFamily(prof.id, other.id)) return { cls: 's-warn', text: '⚠ Pareja de distinto sexo que no es de la misma familia' };
  }
  const r = ctx.recent.get(pid);
  if (r) return { cls: 's-recent', text: `↻ Participó el ${fmtShort(r.q.date)}: ${roleLabel(r.row, r.slot)}` };
  const l = ctx.last.get(pid);
  if (!l) return { cls: 's-never', text: '★ Nunca ha participado' };
  const d = daysBetween(l.q.date, p.date);
  if (d >= state.settings.staleDays) return { cls: 's-stale', text: `★ Hace ${d} días · ${roleLabel(l.row, l.slot)}` };
  return { cls: 's-ok', text: `Última vez hace ${d} días · ${roleLabel(l.row, l.slot)}` };
}

// ---------- guía de jw.org ----------
function newRow(kind, fields) {
  return { id: uid(), kind, section: '', title: '', detail: '', num: null, min: null, song: null, songHref: null,
    intro: false, a: null, b: null, helper: null, men: false, ...fields };
}

function rowsFromHeading(piece, after, section, songHrefs) {
  const minIn = piece.match(/\((\d+)\s*mins?\.?\)/i);
  const title = squash(piece.replace(/\(\d+\s*mins?\.?\)/i, ''));
  const song = title.match(/^canci[oó]n\s+(\d+)/i);
  if (song && /oraci[oó]n/i.test(title)) return [newRow('prayer', { section, song: +song[1], songHref: songHrefs[song[1]] || null, men: true })];
  if (song) return [newRow('song', { section, song: +song[1], songHref: songHrefs[song[1]] || null })];
  if (/palabras de (introducci|conclusi)/i.test(title)) {
    return [newRow('chair', { section, title, min: minIn ? +minIn[1] : null, intro: /introducci/i.test(title) })];
  }
  const numbered = title.match(/^(\d+)\.\s*(.*)$/);
  let t = numbered ? numbered[2] : title;
  const minAfter = after.match(/^\((\d+)\s*mins?\.?\)/i);
  let rest = squash(after.replace(/^\(\d+\s*mins?\.?\)/i, '').replace(/\bRespuesta\b/g, ''));
  const kind = rest.match(/^([A-ZÁÉÍÓÚÑÜ][A-ZÁÉÍÓÚÑÜ ]{3,})\.\s*/);
  if (kind) { t += ` (${capFirst(kind[1].toLowerCase())})`; rest = rest.slice(kind[0].length); }
  const isMaestros = section === SECTIONS[1].name;
  const isDiscurso = /discurso/i.test(t);
  return [newRow('part', {
    section, title: t, num: numbered ? +numbered[1] : null,
    detail: rest.length > 400 ? rest.slice(0, 397) + '…' : rest,
    min: minIn ? +minIn[1] : minAfter ? +minAfter[1] : null,
    helper: isMaestros && !isDiscurso ? 'Ayudante' : /estudio b[ií]blico de la congregaci/i.test(t) ? 'Lector' : null,
    men: !isMaestros || isDiscurso,
  })];
}

function parseGuide(html, monday) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const art = doc.querySelector('#article') || doc.querySelector('article') || doc.body;
  const heads = [...art.querySelectorAll('h1, h2, h3')];
  let reading = '', section = '', title = '';
  const rows = [];
  heads.forEach((el, i) => {
    const text = squash(el.textContent);
    if (!text) return;
    if (el.tagName === 'H1') { title = capFirst(text.toLowerCase()); return; }
    if (el.tagName === 'H2') {
      const sec = SECTIONS.find(s => norm(text).includes(s.key));
      if (sec) section = sec.name;
      else if (!reading && !section) reading = titleCase(text);
      return;
    }
    const songHrefs = {};
    for (const a of el.querySelectorAll('a[href]')) {
      const m = squash(a.textContent).match(/canci[oó]n\s+(\d+)/i);
      if (m) songHrefs[m[1]] = a.getAttribute('href');
    }
    const range = doc.createRange();
    range.setStartAfter(el);
    if (heads[i + 1]) range.setEndBefore(heads[i + 1]); else range.setEndAfter(art.lastChild);
    const after = squash(range.toString());
    for (const piece of text.split('|').map(squash).filter(Boolean)) rows.push(...rowsFromHeading(piece, after, section, songHrefs));
  });
  return { title: title || weekLabel(monday), reading, rows };
}

function blankRows() {
  const [T, M, V] = SECTIONS.map(s => s.name);
  return [
    newRow('prayer', { men: true }),
    newRow('chair', { title: 'Palabras de introducción', min: 1, intro: true }),
    newRow('part', { section: T, num: 1, title: '', min: 10, men: true }),
    newRow('part', { section: T, num: 2, title: 'Busquemos perlas escondidas', min: 10, men: true }),
    newRow('part', { section: T, num: 3, title: 'Lectura de la Biblia', min: 4, men: true }),
    newRow('part', { section: M, num: 4, title: '', min: 3, helper: 'Ayudante' }),
    newRow('part', { section: M, num: 5, title: '', min: 4, helper: 'Ayudante' }),
    newRow('part', { section: M, num: 6, title: '', min: 5, helper: 'Ayudante' }),
    newRow('song', { section: V }),
    newRow('part', { section: V, num: 7, title: '', min: 15, men: true }),
    newRow('part', { section: V, num: 8, title: 'Estudio bíblico de la congregación', min: 30, men: true, helper: 'Lector' }),
    newRow('chair', { section: V, title: 'Palabras de conclusión', min: 3 }),
    newRow('prayer', { section: V, men: true }),
  ];
}

async function serverAvailable() {
  if (serverOK !== null) return serverOK;
  if (location.protocol === 'file:') return serverOK = false;
  try { const r = await fetch('/jw/ping', { cache: 'no-store' }); serverOK = r.ok && (await r.text()) === 'ok'; }
  catch (e) { serverOK = false; }
  return serverOK;
}

async function fetchGuide(monday) {
  const { y, w } = isoWeek(monday);
  const r = await fetch(`/jw/semana?y=${y}&w=${w}`, { cache: 'no-store' });
  if (!r.ok) return null;
  const g = parseGuide(await r.text(), monday);
  return g.rows.some(x => x.kind === 'part') ? g : null;
}

// Títulos de las canciones (se guardan una sola vez)
async function ensureSongTitles(programs) {
  const need = new Map();
  for (const p of programs) for (const r of p.rows) if (r.song && !state.songs[r.song] && !need.has(r.song)) need.set(r.song, r.songHref);
  if (!need.size || !await serverAvailable()) return;
  for (const [n, href] of need) {
    const path = n >= 1 && n <= 151 ? `/es/wol/d/r4/lp-s/${1102016800 + n}` : href;
    if (!path) continue;
    try {
      const r = await fetch('/jw/titulo?path=' + encodeURIComponent(path), { cache: 'no-store' });
      const t = r.ok ? squash(await r.text()) : '';
      if (t) {
        state.songs[n] = t;
        document.querySelectorAll(`[data-song="${n}"]`).forEach(el => { el.textContent = ' - ' + t; });
      }
    } catch (e) {}
  }
  save();
}

function setSync(text, warn = false) {
  syncMsg = { text, warn };
  const el = document.getElementById('sync-text');
  if (el) { el.textContent = text; el.className = warn ? 'notice warn' : 'muted small-text'; }
}

async function syncGuides(manual) {
  if (syncing) return;
  syncing = true;
  setSync('Buscando guías en jw.org…');
  if (manual) serverOK = null;
  if (!await serverAvailable()) {
    syncing = false;
    setSync(location.protocol === 'https:'
      ? 'Desde la versión web no se puede leer jw.org. Busca las semanas desde el programa de PC y aparecerán aquí solas.'
      : 'Para buscar las guías en jw.org, abre la app con el archivo “Programas.bat”.', true);
    return;
  }
  const start = mondayOf(todayISO());
  let added = 0, failed = 0;
  for (let i = 0; i < state.settings.weeksAhead; i++) {
    const monday = addDays(start, i * 7), key = weekKey(monday);
    if (state.programs.some(p => p.week === key)) continue;
    if (!manual && state.missing[key] && Date.now() - state.missing[key] < 12 * 36e5) continue;
    setSync(`Buscando la semana del ${fmtDay(monday)}…`);
    try {
      const g = await fetchGuide(monday);
      if (!g) { state.missing[key] = Date.now(); continue; }
      state.programs.push({ id: uid(), week: key, date: monday, source: 'jw', ...g });
      delete state.missing[key];
      added++;
    } catch (e) { failed++; }
  }
  state.lastSync = Date.now();
  save();
  setSync('Buscando los títulos de las canciones…');
  await ensureSongTitles(state.programs);
  syncing = false;
  setSync(failed ? 'No se pudo conectar con jw.org. Revisa tu conexión a internet.'
    : added ? `Se agregaron ${added} semana${added > 1 ? 's' : ''} desde jw.org.`
      : 'Todo al día: no hay semanas nuevas publicadas todavía.', !!failed);
  if (view.name === 'list') render();
}

async function addWeek(dateISO) {
  const monday = mondayOf(dateISO), key = weekKey(monday);
  const existing = state.programs.find(p => p.week === key);
  if (existing) return go({ name: 'edit', id: existing.id });
  let g = null;
  if (await serverAvailable()) {
    toast('Buscando la guía en jw.org…');
    try { g = await fetchGuide(monday); } catch (e) {}
    if (!g) toast('No se encontró la guía de esa semana. Se creó un programa en blanco.');
  }
  const p = { id: uid(), week: key, date: monday, source: g ? 'jw' : 'manual', ...(g || { title: weekLabel(monday), reading: '', rows: blankRows() }) };
  state.programs.push(p); save();
  go({ name: 'edit', id: p.id });
  ensureSongTitles([p]);
}

// ---------- PDF ----------
function downloadPDF(programs) {
  programs = [...programs].sort((a, b) => a.date.localeCompare(b.date));
  const J = window.jspdf && window.jspdf.jsPDF;
  if (!J) return toast('Se necesita internet para crear el PDF.');
  const s = state.settings;
  const doc = new J({ unit: 'pt', format: s.paper === 'a4' ? 'a4' : 'letter' });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const M = 36, LINE = 13;
  const xTime = M, xDot = M + 36, xTitle = M + 46, xNames = W - M - 170, xLabelR = xNames - 8;
  const name = id => (profById(id) || {}).name || '';
  const printed = new Date().toLocaleDateString('es', { day: '2-digit', month: '2-digit', year: 'numeric' });

  programs.forEach((p, idx) => {
    if (idx) doc.addPage();
    const times = timesFor(p);
    // Encabezado
    doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(0);
    doc.text(s.pdfTitle || 'Programa', M, 46);
    if (s.congregation) doc.text(s.congregation, W - M, 46, { align: 'right' });
    doc.setDrawColor(0); doc.setLineWidth(1.4); doc.line(M, 54, W - M, 54);
    doc.setFontSize(13); doc.setTextColor(0, 112, 192);
    doc.text(fmtMeeting(p) + (p.reading ? '  |  ' + p.reading.toUpperCase() : ''), M, 80);

    let y = 106, sec = '';
    for (const r of p.rows) {
      if (r.section && r.section !== sec) {
        sec = r.section;
        const c = (sectionOf(sec) || { rgb: [87, 90, 93] }).rgb;
        y += 10;
        doc.setFillColor(...c); doc.roundedRect(M, y - 11, 14, 14, 3, 3, 'F');
        doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5); doc.setTextColor(...c);
        doc.text(sec.toUpperCase(), M + 22, y);
        doc.setDrawColor(...c); doc.setLineWidth(0.9); doc.line(M, y + 6, W - M, y + 6);
        y += 24;
      }
      // Título (con minutos)
      const min = (r.kind === 'part' || r.kind === 'chair') && r.min ? ` (${r.min} min.)` : '';
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5);
      const labels = slotLabels(r);
      const titleLines = doc.splitTextToSize(displayTitle(r) + min, xLabelR - xTitle - (labels.a && !labels.soft ? 62 : 6));
      // Nombres
      const slots = [];
      if (isAssignable(r)) {
        if (labels.soft) {
          const pair = [name(r.a), name(r.b)].filter(Boolean).join(' & ');
          slots.push({ label: '', lines: doc.splitTextToSize(pair, W - M - xNames) });
        } else {
          slots.push({ label: labels.a, lines: doc.splitTextToSize(name(r.a), W - M - xNames) });
          if (r.helper) slots.push({ label: labels.b, lines: doc.splitTextToSize(name(r.b), W - M - xNames) });
        }
      }
      const nameLines = slots.reduce((t, x) => t + Math.max(1, x.lines.length), 0);
      const lines = Math.max(titleLines.length, nameLines, 1);
      if (y + lines * LINE > H - 40) { doc.addPage(); y = 50; }

      const c = (sectionOf(r.section) || { rgb: [87, 90, 93] }).rgb;
      doc.setFontSize(10); doc.setTextColor(60); doc.text(fmtTime(times[r.id]), xTime, y);
      doc.setFillColor(...c); doc.circle(xDot, y - 3.5, 2.6, 'F');
      doc.setFontSize(10.5); doc.setTextColor(20);
      doc.text(titleLines, xTitle, y, { lineHeightFactor: LINE / 10.5 });
      let ny = y;
      for (const sl of slots) {
        if (sl.label) { doc.setFont('helvetica', 'bold'); doc.setTextColor(20); doc.text(sl.label, xLabelR, ny, { align: 'right' }); }
        doc.setFont('helvetica', 'normal'); doc.setTextColor(20);
        if (sl.lines.length) doc.text(sl.lines, xNames, ny, { lineHeightFactor: LINE / 10.5 });
        ny += Math.max(1, sl.lines.length) * LINE;
      }
      y += lines * LINE + 8;
      doc.setDrawColor(228); doc.setLineWidth(0.5); doc.line(xTitle, y - 12, W - M, y - 12);
    }
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(140);
    doc.text('Impreso ' + printed, W - M, H - 22, { align: 'right' });
  });
  const fname = programs.length === 1 ? `Programa ${programs[0].title}` : `Programas ${programs[0].title} a ${programs[programs.length - 1].title}`;
  doc.save(fname.replace(/[\\/:*?"<>|]+/g, '') + '.pdf');
}

// ---------- Hojas de asignación (una por hoja) ----------
const isStudentPart = r => hasCounsel(r);

function downloadSlips(items) {
  const J = window.jspdf && window.jspdf.jsPDF;
  if (!J) return toast('Se necesita internet para crear el PDF.');
  if (!items.length) return toast('Elige al menos una asignación.');
  const s = state.settings;
  const doc = new J({ unit: 'pt', format: s.paper === 'a4' ? 'a4' : 'letter' });
  const W = doc.internal.pageSize.getWidth();
  const name = id => (profById(id) || {}).name || '';

  // Medidas tomadas de la hoja de ejemplo (puntos, carta)
  const bold = size => { doc.setFont('helvetica', 'bold'); doc.setFontSize(size); };
  const regular = size => { doc.setFont('helvetica', 'normal'); doc.setFontSize(size); };
  const slipDate = iso => iso.replace(/-/g, '/');

  items.forEach(({ p, row }, idx) => {
    if (idx) doc.addPage();
    doc.setTextColor(0);

    // Título
    bold(23);
    doc.text('ASIGNACIÓN PARA LA REUNIÓN', W / 2, 48, { align: 'center' });
    doc.text('VIDA Y MINISTERIO CRISTIANOS', W / 2, 74, { align: 'center' });

    // Datos: etiqueta en x 49, valor en x 209, renglones de 46 pt
    let y = 111;
    const field = (label, value) => {
      bold(21); doc.text(label, 49, y);
      regular(21);
      const lines = value ? doc.splitTextToSize(value, W - 52 - 209) : [];
      if (lines.length) doc.text(lines, 209, y, { lineHeightFactor: 1.15 });
      y += Math.max(0, lines.length - 1) * 24 + 46;
    };
    field('Nombre:', name(row.a));
    field(row.helper === 'Lector' ? 'Lector:' : 'Ayudante:', row.helper ? name(row.b) : '');
    field('Fecha:', slipDate(meetingDate(p)));

    // "Intervención núm.:" va en dos renglones; el tipo de intervención pasa a la descripción
    const kind = (row.title || '').match(/^(.*\S)\s+\(([^)]+)\)$/);
    const title = (row.num ? row.num + '. ' : '') + (kind ? kind[1] : row.title);
    bold(21); doc.text('Intervención', 49, y); doc.text('núm.:', 49, y + 24);
    regular(21);
    const tLines = doc.splitTextToSize(title, W - 52 - 209);
    doc.text(tLines, 209, y, { lineHeightFactor: 1.15 });
    y += Math.max(24, (tLines.length - 1) * 24) + 41;

    // Descripción de la Guía de actividades
    const desc = [row.min ? `(${row.min} ${row.min === 1 ? 'min.' : 'mins.'})` : '', kind ? kind[2].toUpperCase() + '.' : '', row.detail || '']
      .filter(Boolean).join(' ');
    if (desc) {
      regular(19);
      const dLines = doc.splitTextToSize(desc, W - 52 - 82);
      doc.text(dLines, 82, y, { lineHeightFactor: 1.15 });
      y += (dLines.length - 1) * 22;
    }

    // Lugar (las posiciones del ejemplo, salvo que la descripción sea más larga)
    y = Math.max(389, y + 54);
    bold(21); doc.text('Se presentará en:', 52, y);
    y += 36;
    ['Auditorio principal', 'Sala auxiliar núm. 1', 'Sala auxiliar núm. 2'].forEach((place, i) => {
      doc.setDrawColor(0); doc.setLineWidth(1); doc.rect(53, y - 13, 14, 14);
      if (i === 0) { doc.setLineWidth(1.8); doc.lines([[3, 4], [7, -10]], 56, y - 5); }
      regular(19); doc.text(place, 94, y - 1);
      y += 23;
    });

    // Nota al estudiante (la etiqueta en negrita y el texto sigue en el mismo renglón)
    y = Math.max(552, y + 58);
    const right = W - 89;
    bold(19); doc.text('Nota al estudiante:', 52, y);
    let x = 52 + doc.getTextWidth('Nota al estudiante: ');
    regular(19);
    for (const word of (s.slipNote || '').split(/\s+/).filter(Boolean)) {
      const w = doc.getTextWidth(word);
      if (x + w > right && x > 52) { y += 21.5; x = 52; }
      doc.text(word, x, y);
      x += w + doc.getTextWidth(' ');
    }

    // Pie (opcional)
    if (s.slipFooter) { regular(15); doc.text(s.slipFooter, 52, y + 45); }
  });

  const first = items[0];
  const fname = items.length === 1
    ? `Asignación ${name(first.row.a) || 'sin nombre'} - ${first.p.title}`
    : `Asignaciones ${[...new Set(items.map(x => x.p.title))].join(', ')}`;
  doc.save(fname.replace(/[\\/:*?"<>|]+/g, '') + '.pdf');
}

// ---------- congregación en la nube (Firebase) ----------
// Firestore: codigos/{código} → congregación; congregaciones/{id} con miembros/{uid},
// privado/estado (todos los datos, solo admins), publico/programa (semanas con nombres,
// para todos) e informes/{uid_AAAA-MM}. Quién puede qué lo deciden las reglas (firestore.rules).
// Desde la 1.3 los datos van por partes (perfiles/, familias/, semanas/, config/ajustes) en vez de
// un solo privado/estado (que tenía límite de 1 MB); privado/estado queda como copia de la 1.2.
const nube = { user: null, cong: null, congData: null, me: null, acceso: '', listo: false, publico: null,
  miembros: [], sent: {}, ultimoPub: '', registro: null, inicial: null, unsubMe: null, unsubDatos: [] };
// Funciones que el coordinador puede dar a cada cuenta (el coordinador tiene todas)
const PERMS = [
  ['programa', 'Programa VyM', 'Semanas, perfiles, familias y ajustes de la reunión'],
  ['secretario', 'Secretario', 'Informes de todos: verlos y capturarlos'],
];
// Colecciones que se guardan por documento: [colección, parte de state, permisos para leer]
const COLLS = [['perfiles', 'profiles', ['programa', 'secretario']], ['familias', 'families', ['programa']], ['semanas', 'programs', ['programa']]];
let F = null; // funciones de Firebase, cargadas al abrir

async function loadFirebase() {
  const base = 'https://www.gstatic.com/firebasejs/13.1.0/firebase-';
  const [app, auth, fs] = await Promise.all(['app', 'auth', 'firestore'].map(m => import(base + m + '.js')));
  const a = app.initializeApp(FB_CONFIG);
  F = { ...auth, ...fs, auth: auth.getAuth(a), db: fs.initializeFirestore(a, { ignoreUndefinedProperties: true }) };
  if (EMU) {
    auth.connectAuthEmulator(F.auth, 'http://127.0.0.1:9099', { disableWarnings: true });
    fs.connectFirestoreEmulator(F.db, '127.0.0.1', 8080);
  }
}
const ref = (...path) => F.doc(F.db, ...path);
const congRef = (...path) => ref('congregaciones', nube.cong, ...path);
const isAdmin = () => !!(nube.me && nube.me.estado === 'activo' && nube.me.admin); // coordinador
const can = p => isAdmin() || !!(nube.me && nube.me.estado === 'activo' && (nube.me.permisos || []).includes(p));
const accessKey = () => nube.me ? JSON.stringify([!!nube.me.admin, [...(nube.me.permisos || [])].sort()]) : '';
const reportsByMembers = () => !nube.congData || nube.congData.modo !== 'encargados';
// JSON con las claves ordenadas, para saber si un documento cambió de verdad
const stable = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x)
  ? Object.fromEntries(Object.keys(x).sort().map(key => [key, x[key]])) : x);
const clean = v => JSON.parse(JSON.stringify(v));
const configOf = s => ({ settings: s.settings, songs: s.songs, missing: s.missing, lastSync: s.lastSync });
const byNombre = (a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es');
const fmtStamp = t => t && t.toDate ? t.toDate().toLocaleString('es', { day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' }) : '';
const busy = () => !!document.querySelector('dialog[open]') || /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName);

function errMsg(e) {
  const c = (e && e.code) || '';
  return ({
    'auth/invalid-email': 'El correo no es válido.',
    'auth/invalid-credential': 'Correo o contraseña incorrectos.',
    'auth/wrong-password': 'Correo o contraseña incorrectos.',
    'auth/user-not-found': 'No hay ninguna cuenta con ese correo.',
    'auth/missing-password': 'Escribe la contraseña.',
    'auth/email-already-in-use': 'Ya hay una cuenta con ese correo. Usa “Entrar”.',
    'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
    'auth/too-many-requests': 'Demasiados intentos. Espera unos minutos y vuelve a intentar.',
    'auth/network-request-failed': 'No hay conexión a internet.',
    'permission-denied': 'No tienes permiso para hacer esto.',
    'unavailable': 'No hay conexión con el servidor. Revisa tu internet.',
    'codigo': 'Ese código de congregación no existe. Pídeselo de nuevo a un administrador.',
  })[c] || 'Ocurrió un error: ' + ((e && e.message) || c);
}

function newCode() {
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', n = crypto.getRandomValues(new Uint8Array(6));
  return [...n].map(x => abc[x % abc.length]).join('');
}
async function freeCode() {
  for (let i = 0; i < 5; i++) { const c = newCode(); if (!(await F.getDoc(ref('codigos', c))).exists()) return c; }
  throw new Error('No se pudo crear un código, intenta de nuevo.');
}

async function joinCongregation(codigo, nombre) {
  const code = (codigo || '').toUpperCase().replace(/\s+/g, '');
  const c = code && await F.getDoc(ref('codigos', code));
  if (!c || !c.exists()) throw { code: 'codigo' };
  const cid = c.data().cong, u = nube.user;
  await F.setDoc(ref('congregaciones', cid, 'miembros', u.uid), { nombre: squash(nombre), email: u.email, estado: 'pendiente',
    admin: false, permisos: [], perfil: null, codigo: code, creado: F.serverTimestamp() });
  await F.setDoc(ref('usuarios', u.uid), { cong: cid });
  nube.cong = cid;
}

async function createCongregation(nombreCong, nombre) {
  const u = nube.user, cid = F.doc(F.collection(F.db, 'congregaciones')).id, code = await freeCode();
  await F.setDoc(ref('congregaciones', cid), { nombre: squash(nombreCong), codigo: code, creador: u.uid, modo: 'todos' });
  await F.setDoc(ref('codigos', code), { cong: cid });
  await F.setDoc(ref('congregaciones', cid, 'miembros', u.uid), { nombre: squash(nombre), email: u.email, estado: 'activo',
    admin: true, permisos: [], perfil: null, codigo: code, creado: F.serverTimestamp() });
  // Si esta PC ya tenía datos (versión sin cuentas), se pueden llevar a la congregación nueva.
  // Se suben al entrar (firstLoad), por el mismo camino que cualquier cambio.
  let datos = defaults();
  const local = load();
  if ((local.programs.length || local.profiles.length) &&
    confirm(`En este equipo hay ${local.profiles.length} perfiles y ${local.programs.length} semanas guardados. ¿Subirlos a la congregación nueva?`)) datos = local;
  datos.settings.congregation = squash(nombreCong);
  nube.inicial = datos;
  await F.setDoc(ref('usuarios', u.uid), { cong: cid });
  nube.cong = cid;
}

async function changeCode() {
  if (!confirm('Se creará un código nuevo y el actual dejará de servir para crear cuentas. Las cuentas que ya existen no cambian. ¿Continuar?')) return;
  try {
    const old = nube.congData.codigo, code = await freeCode();
    await F.setDoc(ref('codigos', code), { cong: nube.cong });
    await F.updateDoc(congRef(), { codigo: code });
    if (old) await F.deleteDoc(ref('codigos', old)).catch(() => {});
    toast('Código nuevo: ' + code);
  } catch (e) { toast(errMsg(e)); }
}

// Al abrir: carga Firebase y sigue la sesión (entrar, salir, aprobación, cambio de rol)
async function startCloud() {
  screen(h('div', { class: 'card auth-card' }, h('p', { class: 'muted' }, 'Conectando…')));
  try { await loadFirebase(); }
  catch (e) { return screenMessage('No se pudo conectar. Revisa tu internet y vuelve a abrir la app.'); }
  F.onAuthStateChanged(F.auth, async user => {
    stopListening(); if (nube.unsubMe) { nube.unsubMe(); nube.unsubMe = null; }
    Object.assign(nube, { user, cong: null, congData: null, me: null, acceso: '', listo: false, miembros: [], publico: null, sent: {}, ultimoPub: '' });
    if (!user) return renderAuth();
    screen(h('div', { class: 'card auth-card' }, h('p', { class: 'muted' }, 'Cargando tu cuenta…')));
    let joinErr = '';
    try {
      const reg = nube.registro; nube.registro = null;
      if (reg && reg.tipo === 'unirse') await joinCongregation(reg.codigo, reg.nombre).catch(e => { joinErr = errMsg(e); });
      else if (reg && reg.tipo === 'crear') await createCongregation(reg.cong, reg.nombre);
      if (!nube.cong) { const u = await F.getDoc(ref('usuarios', user.uid)); nube.cong = u.exists() ? u.data().cong : null; }
    } catch (e) { return screenMessage(errMsg(e)); }
    if (!nube.cong) return renderJoin(joinErr);
    nube.unsubMe = F.onSnapshot(congRef('miembros', user.uid), snap => {
      nube.me = snap.exists() ? snap.data() : null;
      if (!nube.me || nube.me.estado !== 'activo') {
        stopListening(); nube.acceso = ''; nube.listo = false;
        return nube.me ? renderWaiting() : renderJoin('Tu solicitud fue rechazada o se quitó tu cuenta de la congregación.');
      }
      // Si cambian sus funciones, se vuelve a cargar con lo que ahora puede ver
      const key = accessKey();
      if (key !== nube.acceso) { nube.acceso = key; enterCongregation(); }
      else if (nube.listo && !busy()) render();
    }, e => screenMessage(errMsg(e)));
  });
}

function stopListening() { nube.unsubDatos.forEach(f => f()); nube.unsubDatos = []; }

// Escucha lo que esta cuenta puede ver según sus funciones. Los cambios de otros llegan solos.
function enterCongregation() {
  stopListening();
  nube.listo = false; nube.sent = {}; nube.ultimoPub = ''; view = { name: 'list' };
  state = defaults();
  screen(h('div', { class: 'card auth-card' }, h('p', { class: 'muted' }, 'Cargando la congregación…')));
  const waiting = new Set();
  // fn devuelve true si cambió algo que hay que volver a dibujar
  const listen = (name, r, fn) => {
    waiting.add(name);
    nube.unsubDatos.push(F.onSnapshot(r, s => {
      const changed = fn(s);
      if (waiting.delete(name) && !waiting.size) return firstLoad();
      if (nube.listo && changed) { if (!busy()) render(); else if (name !== 'cong') toast('Otro hermano hizo cambios; se verán al terminar de editar.'); }
    }, e => screenMessage(errMsg(e))));
  };
  listen('cong', congRef(), s => { nube.congData = s.data() || {}; return true; });
  if (isAdmin()) listen('miembros', F.collection(F.db, 'congregaciones', nube.cong, 'miembros'), s => {
    nube.miembros = s.docs.map(d => ({ id: d.id, ...d.data() }));
    if (nube.listo && view.name !== 'users') buildNav();
    return view.name === 'users';
  });
  for (const [col, key, perms] of COLLS) if (perms.some(can)) listen(col, F.collection(F.db, 'congregaciones', nube.cong, col), s => receiveDocs(col, key, s));
  if (can('programa')) listen('config', congRef('config', 'ajustes'), receiveConfig);
  else listen('publico', congRef('publico', 'programa'), s => { nube.publico = s.exists() ? s.data() : null; return true; });
}

// Cambios de otros en una colección (los propios ya están en state)
function receiveDocs(col, key, snap) {
  const sent = nube.sent[col] || (nube.sent[col] = new Map());
  let changed = false;
  for (const ch of snap.docChanges()) {
    if (ch.doc.metadata.hasPendingWrites) continue;
    const id = ch.doc.id, list = state[key], i = list.findIndex(o => o.id === id);
    if (ch.type === 'removed') {
      if (sent.has(id)) { sent.delete(id); if (i >= 0) list.splice(i, 1); changed = true; }
      continue;
    }
    const data = { ...ch.doc.data(), id }, json = stable(data);
    if (sent.get(id) === json) continue;
    sent.set(id, json);
    if (i >= 0) list[i] = data; else list.push(data);
    changed = true;
  }
  if (changed && key !== 'programs') refreshDatalist();
  return changed;
}
function receiveConfig(snap) {
  if (!snap.exists() || snap.metadata.hasPendingWrites) return false;
  const d = snap.data(), json = stable(d);
  if (nube.sent.config === json) return false;
  nube.sent.config = json;
  Object.assign(state, hydrate({ ...configOf(state), ...d, profiles: [], families: [], programs: [] }), {
    profiles: state.profiles, families: state.families, programs: state.programs });
  return true;
}

// Ya llegó todo por primera vez: si la congregación está vacía, se suben los datos
// iniciales (congregación nueva) o los de la versión 1.2 (privado/estado).
async function firstLoad() {
  if (can('programa') && !state.profiles.length && !state.programs.length && !nube.sent.config) {
    let datos = nube.inicial; nube.inicial = null;
    if (!datos && isAdmin()) {
      try {
        const old = await F.getDoc(congRef('privado', 'estado'));
        if (old.exists() && !old.data().migrado) { datos = JSON.parse(old.data().datos); nube.migrar = true; }
      } catch (e) {}
    }
    if (datos) {
      const fresh = hydrate(datos);
      state.profiles.push(...fresh.profiles); state.families.push(...fresh.families); state.programs.push(...fresh.programs);
      Object.assign(state, configOf(fresh));
      await uploadState();
      if (nube.migrar) { await F.updateDoc(congRef('privado', 'estado'), { migrado: true }).catch(() => {}); nube.migrar = false; }
    }
  }
  // El nombre de la congregación se cambia en Ajustes (coordinador); el PDF lo toma de aquí
  if (can('programa') && nube.congData.nombre && state.settings.congregation !== nube.congData.nombre) {
    state.settings.congregation = nube.congData.nombre; save();
  }
  nube.listo = true;
  render();
  if (can('programa')) startJw();
}

function saveCloud() {
  if (!can('programa') || !nube.listo) return;
  clearTimeout(saveCloud.t);
  saveCloud.t = setTimeout(uploadState, 800);
}
// Sube solo los documentos que cambiaron (y borra los que ya no están)
async function uploadState() {
  clearTimeout(saveCloud.t); saveCloud.t = null;
  const writes = [];
  for (const [col, key] of COLLS) {
    const sent = nube.sent[col] || (nube.sent[col] = new Map()), now = new Map(state[key].map(o => [o.id, o]));
    for (const [id, o] of now) {
      const json = stable(o);
      if (sent.get(id) !== json) { sent.set(id, json); writes.push(F.setDoc(congRef(col, id), clean(o))); }
    }
    for (const id of [...sent.keys()]) if (!now.has(id)) { sent.delete(id); writes.push(F.deleteDoc(congRef(col, id))); }
  }
  const config = clean(configOf(state)), json = stable(config);
  if (nube.sent.config !== json) { nube.sent.config = json; writes.push(F.setDoc(congRef('config', 'ajustes'), config)); }
  try { await Promise.all(writes); await publishProgram(); }
  catch (e) { toast('No se pudo guardar en la nube: ' + errMsg(e)); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveCloud.t) uploadState(); });

// Lo que ven todos: semanas desde hace un mes, ya con horas y nombres (sin edades ni notas)
function publicWeeks() {
  const from = addDays(mondayOf(todayISO()), -28);
  const person = id => { const pr = id && profById(id); return pr ? { id, n: pr.name } : null; };
  return state.programs.filter(p => p.date >= from).sort((a, b) => a.date.localeCompare(b.date)).map(p => {
    const t = timesFor(p);
    return { id: p.id, date: p.date, day: meetingDate(p), title: p.title, reading: p.reading || '', meeting: fmtMeeting(p),
      rows: p.rows.map(r => ({ kind: r.kind, section: r.section || '', t: displayTitle(r), min: r.kind === 'part' ? +r.min || null : null,
        time: fmtTime(t[r.id]), detail: r.kind === 'part' ? r.detail || '' : '', labels: slotLabels(r),
        a: isAssignable(r) ? person(r.a) : null, b: isAssignable(r) && r.helper ? person(r.b) : null })) };
  });
}
async function publishProgram() {
  const semanas = JSON.stringify(publicWeeks());
  if (semanas === nube.ultimoPub) return;
  nube.ultimoPub = semanas;

}

function renderAuth(tab = 'entrar', msg = '') {
  const field = (label, el) => h('label', { class: 'field' }, label, el);
  const email = h('input', { type: 'email', autocomplete: 'email', placeholder: 'tu@correo.com' });
  const pass = h('input', { type: 'password', autocomplete: tab === 'entrar' ? 'current-password' : 'new-password',
    placeholder: tab === 'entrar' ? '' : 'Al menos 6 caracteres' });
  const code = h('input', { type: 'text', autocomplete: 'off', placeholder: 'Ej.: K7M3QX', style: { textTransform: 'uppercase' } });
  const name = h('input', { type: 'text', autocomplete: 'name', placeholder: 'Nombre y apellido' });
  const congI = h('input', { type: 'text', placeholder: 'Ej.: Congregación Centro' });
  const err = h('div', { class: 'err' }, msg);
  const btn = h('button', { class: 'btn primary', onclick: submit },
    tab === 'entrar' ? 'Entrar' : tab === 'unirse' ? 'Crear mi cuenta' : 'Crear congregación');

  async function submit() {
    err.textContent = '';
    const em = email.value.trim(), pw = pass.value;
    if (tab !== 'entrar') {
      if (tab === 'unirse' && !code.value.trim()) return err.textContent = 'Escribe el código de la congregación.';
      if (tab === 'crear' && !squash(congI.value)) return err.textContent = 'Escribe el nombre de la congregación.';
      if (!squash(name.value)) return err.textContent = 'Escribe tu nombre.';
    }
    btn.disabled = true;
    try {
      if (tab === 'entrar') await F.signInWithEmailAndPassword(F.auth, em, pw);
      else {
        nube.registro = tab === 'unirse' ? { tipo: 'unirse', codigo: code.value, nombre: name.value } : { tipo: 'crear', cong: congI.value, nombre: name.value };
        await F.createUserWithEmailAndPassword(F.auth, em, pw);
      }
    } catch (e) { nube.registro = null; err.textContent = errMsg(e); btn.disabled = false; }
  }
  async function forgot() {
    const em = email.value.trim();
    if (!em) return err.textContent = 'Escribe tu correo y vuelve a pulsar “¿Olvidaste tu contraseña?”.';
    try { await F.sendPasswordResetEmail(F.auth, em); toast('Te enviamos un correo para cambiar tu contraseña.'); }
    catch (e) { err.textContent = errMsg(e); }
  }

  const card = h('div', { class: 'card auth-card' },
    h('h2', null, '📋 Programas'),
    h('div', { class: 'tabs' }, [['entrar', 'Entrar'], ['unirse', 'Crear cuenta'], ['crear', 'Nueva congregación']].map(([k, t]) =>
      h('button', { class: k === tab ? 'on' : null, onclick: () => renderAuth(k) }, t))),
    tab === 'unirse' ? h('p', { class: 'muted small-text' }, 'Pide el código a un administrador de tu congregación. Tu cuenta quedará en espera hasta que te aprueben.') : null,
    tab === 'crear' ? h('p', { class: 'muted small-text' }, 'Solo para el primer administrador. Después compartirás el código para que los demás creen su cuenta.') : null,
    tab === 'unirse' ? field('Código de la congregación', code) : null,
    tab === 'crear' ? field('Nombre de la congregación', congI) : null,
    tab !== 'entrar' ? field('Tu nombre', name) : null,
    field('Correo', email), field('Contraseña', pass),
    err, btn,
    tab === 'entrar' ? h('button', { class: 'linkbtn', onclick: forgot }, '¿Olvidaste tu contraseña?') : null);
  card.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') submit(); });
  screen(card);
}

// ---------- vista de publicadores ----------
function myAssignments(weeks) {
  const pid = nube.me && nube.me.perfil, today = todayISO(), out = [];
  if (!pid) return out;
  for (const w of weeks) {
    if ((w.day || addDays(w.date, 6)) < today) continue; // la reunión ya pasó
    for (const r of w.rows) for (const k of ['a', 'b']) {
      if (!r[k] || r[k].id !== pid) continue;
      const other = r[k === 'a' ? 'b' : 'a'];
      out.push({ w, r, role: r.labels[k] || '', with: other ? other.n : '' });
    }
  }
  return out;
}

function nextAssignmentCard(weeks) {
  const title = h('div', { class: 'small-text muted' }, 'Tu próxima asignación');
  if (!nube.me || !nube.me.perfil) return h('div', { class: 'card mine' }, title,
    h('div', null, 'Un administrador todavía no ha unido tu cuenta con tu perfil. Cuando lo haga, aquí verás tus asignaciones.'));
  const [x, ...rest] = myAssignments(weeks);
  if (!x) return h('div', { class: 'card mine' }, title, h('div', null, 'No tienes asignaciones en las próximas semanas.'));
  return h('div', { class: 'card mine' }, title,
    h('div', { class: 'mine-t' }, x.r.t),
    h('div', null, `${x.w.meeting} · ${x.r.time}`),
    x.role ? h('div', null, h('strong', null, x.role), x.with ? ` · con ${x.with}` : '') : null,
    x.r.detail ? h('div', { class: 'detail' }, x.r.detail) : null,
    rest.length ? h('div', { class: 'small-text muted', style: { marginTop: '6px' } },
      'Después: ' + rest.map(y => `${fmtShort(y.w.date)} (${y.r.t})`).join(' · ')) : null);
}

function publicWeekCard(w, open) {
  const pid = nube.me && nube.me.perfil, body = [];
  let sec = null;
  for (const r of w.rows) {
    if (r.section && r.section !== sec) {
      sec = r.section; const s = sectionOf(sec);
      body.push(h('div', { class: 'psec', style: { '--sec': s ? s.css : 'var(--sec-none)' } }, h('i'), sec));
    }
    const names = ['a', 'b'].filter(k => r[k]).map(k =>
      h('span', { class: r[k].id === pid ? 'yo' : null }, (r.labels[k] ? r.labels[k] + ': ' : '') + r[k].n));
    body.push(h('div', { class: 'vrow' }, h('span', { class: 'ptime' }, r.time),
      h('div', null, h('div', { class: 'pt' }, r.t, r.min ? h('span', { class: 'min' }, ` (${r.min} mins.)`) : null),
        names.length ? h('div', { class: 'vnames' }, names) : null)));

  return h('details', { class: 'card vweek', open: open || null },
    h('summary', null, h('strong', null, w.title), h('span', { class: 'muted small-text' }, ' · ' + w.meeting)),
    h('div', { class: 'vbody' }, body));
}

// ---------- informe mensual ----------
function recentMonths(n) {
  const out = [], d = new Date(); d.setDate(1);
  for (let i = 0; i < n; i++) { out.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`); d.setMonth(d.getMonth() - 1); }
  return out;
}
const fmtMonth = m => capFirst(new Date(m + '-15T12:00:00').toLocaleDateString('es', { month: 'long', year: 'numeric' }));
// Del 1 al 20 normalmente se informa el mes anterior
const defaultMonth = () => recentMonths(2)[new Date().getDate() <= 20 ? 1 : 0];
const monthSelect = (months, value, onchange) => h('select', { onchange: e => onchange(e.target.value) },
  months.map(m => h('option', { value: m, selected: m === value ? true : null }, fmtMonth(m))));

// Formulario de un informe (el propio, o el de otro si lo captura el secretario)
function reportForm(perfil, nombre, month, prev, onSaved, own) {
    const id = `${perfil}_${month}`;
    let part = prev ? prev.participo : null;
    const yes = h('input', { type: 'radio', name: 'participo-' + id, checked: part === true, onchange: () => { part = true; } });
    const no = h('input', { type: 'radio', name: 'participo-' + id, checked: part === false, onchange: () => { part = false; } });
    const hours = h('input', { type: 'number', min: 0, max: 744, step: 'any', placeholder: 'Opcional', style: { width: '140px' },
      value: prev && prev.horas != null ? prev.horas : '' });
    const studies = h('input', { type: 'number', min: 0, max: 99, step: 1, style: { width: '100px' }, value: prev ? prev.cursos : 0 });
    const notes = h('textarea', { rows: 3, maxlength: 1000, placeholder: 'Opcional' }, prev ? prev.notas : '');
    const err = h('div', { class: 'err' });
    const btn = h('button', { class: 'btn primary', onclick: async () => {
      err.textContent = '';
      if (part === null) return err.textContent = own ? 'Indica si participaste en la predicación.' : 'Indica si participó en la predicación.';
      const hv = hours.value.trim() === '' ? null : Math.round(Number(hours.value) * 100) / 100;
      if (hv != null && !(hv >= 0 && hv <= 744)) return err.textContent = 'Revisa las horas.';
      const cv = Math.round(Number(studies.value) || 0);
      if (cv < 0 || cv > 99) return err.textContent = 'Revisa los cursos bíblicos.';
      btn.disabled = true;
      try {
        await F.setDoc(congRef('informes', id), { perfil, nombre, mes: month, participo: part, horas: hv, cursos: cv,
          notas: notes.value.trim().slice(0, 1000), enviado: F.serverTimestamp(), por: nube.user.uid });
        toast(own ? 'Informe enviado. ¡Gracias!' : `Informe de ${nombre} guardado`);
        onSaved();
      } catch (e) { err.textContent = errMsg(e); btn.disabled = false; }
    } }, prev ? 'Actualizar informe' : own ? 'Enviar informe' : 'Guardar informe');
    return h('div', { class: 'settings' },
      h('div', { class: 'field' }, h('span', null, own ? '¿Participaste en alguna forma de la predicación este mes?' : '¿Participó en alguna forma de la predicación este mes?'),
        h('div', { class: 'radios' }, h('label', null, yes, 'Sí'), h('label', null, no, 'No'))),
      h('div', { class: 'row', style: { gap: '20px', alignItems: 'flex-end' } },
        h('label', { class: 'field' }, 'Horas (precursores)', hours),
        h('label', { class: 'field' }, 'Cursos bíblicos', studies)),
      h('label', { class: 'field' }, 'Notas', notes),
      prev ? h('div', { class: 'small-text muted' }, `Enviado ${prev.enviado ? 'el ' + fmtStamp(prev.enviado) : ''}. Se puede corregir y volver a guardar.`) : null,
      err, h('div', { class: 'row' }, btn));
}

// Secretario (o coordinador): los informes de todos los perfiles para un mes. Tocar una
// fila abre el informe para capturarlo o corregirlo.
function congregationReports() {
  let month = defaultMonth();
  const box = h('div');
  async function reload() {
    box.replaceChildren(h('div', { class: 'muted' }, 'Cargando…'));
    let docs;
    try {
      const q = F.query(F.collection(F.db, 'congregaciones', nube.cong, 'informes'), F.where('mes', '==', month));
      docs = (await F.getDocs(q)).docs.map(d => d.data());
    } catch (e) { return box.replaceChildren(h('div', { class: 'err' }, errMsg(e))); }
    const byProfile = new Map(docs.map(d => [d.perfil, d]));
    const people = state.profiles.map(p => ({ id: p.id, nombre: p.name, r: byProfile.get(p.id) }));
    for (const d of docs) if (!people.some(p => p.r === d)) people.push({ id: d.perfil, nombre: d.nombre + ' (perfil eliminado)', r: d });
    people.sort(byNombre);
    const sent = docs.length, joined = docs.filter(d => d.participo).length;
    const hours = docs.reduce((a, d) => a + (d.horas || 0), 0), studies = docs.reduce((a, d) => a + (d.cursos || 0), 0);
    const open = p => {
      const dlg = h('dialog', { class: 'dlg' },
        h('div', { class: 'dlg-body' }, h('h3', null, `${p.nombre} · ${fmtMonth(month)}`),
          reportForm(p.id, p.nombre, month, p.r || null, () => { dlg.close(); reload(); }, false)),
        h('div', { class: 'dlg-foot' }, h('button', { class: 'btn', onclick: () => dlg.close() }, 'Cerrar')));
      dlg.addEventListener('close', () => dlg.remove());
      document.body.append(dlg); dlg.showModal();
    };
    box.replaceChildren(
      h('div', { class: 'totals' },
        h('span', null, h('strong', null, `${sent} de ${people.length}`), ' con informe'),
        h('span', null, h('strong', null, joined), ' participaron'),
        h('span', null, h('strong', null, Math.round(hours * 100) / 100), ' horas'),
        h('span', null, h('strong', null, studies), ' cursos')),
      h('div', { class: 'tablewrap' }, h('table', { class: 'stats' },
        h('thead', null, h('tr', null, ['Nombre', '¿Participó?', 'Horas', 'Cursos', 'Notas'].map(t => h('th', null, t)))),
        h('tbody', null, people.length ? people.map(p => h('tr', { onclick: () => open(p), title: 'Tocar para capturar o corregir' },
          h('td', null, h('strong', null, p.nombre)),
          p.r ? [h('td', null, p.r.participo ? 'Sí' : 'No'), h('td', null, p.r.horas ?? '—'), h('td', null, p.r.cursos || 0),
            h('td', { class: 'small-text' }, p.r.notas || '')]
            : h('td', { colspan: 4 }, h('span', { class: 'badge s-warn' }, 'Sin informe'))))
          : h('tr', null, h('td', { colspan: 5, class: 'empty' }, 'Todavía no hay perfiles. Se crean en Perfiles.'))))));
  }
  reload();
  const el = h('div', { style: { marginTop: '28px' } },
    h('h2', { style: { fontSize: '18px', margin: '0 0 4px' } }, 'Informes de la congregación'),
    h('p', { class: 'sub' }, 'Solo el secretario y el coordinador ven esta parte. Toca un nombre para capturar o corregir su informe.'),
    h('div', { class: 'card', style: { padding: '14px' } },
      h('div', { class: 'row', style: { marginBottom: '10px' } },
        monthSelect(recentMonths(12), month, m => { month = m; reload(); }),
        h('button', { class: 'btn small', onclick: () => reload() }, '↻ Actualizar')),
      box));
  return { el, reload };
}
